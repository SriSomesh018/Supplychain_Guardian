/* ================= 5. GRAPH ================= */
let gMode = 'tree', gOnly = true;
function graph(el){
  const G = R.graph;
  el.innerHTML = `<div class="vhead"><div><h2>Risk paths</h2><p>Your app in the middle of its supply chain: the packages the developers chose, and the exact path to every risky or newly-appeared package.</p></div><a class="btn" href="#/r/${SLUG}/fullgraph">Open full graph →</a></div>
    ${plain('Each dot is a package; an arrow means "needs". <b>Red</b> dots are risky. Bigger means riskier. Follow the arrows from the app to see <i>how</i> a risky package got in. Click a dot for details.')}
    <div class="card gcard">
      <div class="toolbar"><div class="seg"><button data-m="tree" class="${gMode==='tree'?'on':''}">🌲 Tree view</button><button data-m="web" class="${gMode==='web'?'on':''}">🕸️ Network view</button></div>
        <input class="in" id="gq" list="gl" placeholder="Find a package…" style="min-width:240px;flex:1"><datalist id="gl">${G.nodes.map(n=>`<option value="${esc(n.label)}">`).join('')}</datalist>
        <label class="small"><input type="checkbox" id="gOnly" ${gOnly?'checked':''}> risky paths only</label><button class="btn" id="gFit">⤢ Fit</button></div>
      <div id="net"></div>
      <div class="card glegend"><span><i class="sw box" style="background:var(--brand)"></i>your app</span><span><i class="sw dia" style="background:#475569"></i>direct: listed in package.json</span><span><i class="sw" style="background:#cbd5e1"></i>transitive: pulled in by another package</span><span><i class="sw" style="background:var(--crit)"></i>risky</span><span><i class="sw" style="background:#fff;border:2px dashed #94a3b8"></i>dev-only</span></div>
      <div class="card gpanel" id="gp"><div class="eyebrow">How to read this</div><p class="small muted">${G.nodes.length} packages shown out of ${fmt(R.checkpoint.what_is_in_the_app.total_components)}: everything the developers chose, plus the path to each of the ${G.nodes.filter(n=>n.flagged).length} risky ones.</p>
        <div class="why direct"><h5>◆ Direct</h5>Listed by the developers in <span class="fname">package.json</span> and installed at the top level of <span class="fname">package-lock.json</span>. These are the diamonds joined to the app by a bold edge.</div>
        <div class="why trans"><h5>● Transitive</h5>Not in <span class="fname">package.json</span>. It is in <span class="fname">package-lock.json</span> only because another package asked for it. Click any dot to see who asked, and for which version.</div></div>
    </div>`;
  el.querySelectorAll('.seg button').forEach(b => b.onclick = () => { gMode = b.dataset.m; graph(el); });
  draw(gOnly);
  $('#gOnly').onchange = e => { gOnly = e.target.checked; draw(gOnly); };
  function draw(only){
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const id = x => x === '' ? '__root__' : x;
    const keep = new Set(); const pred = {};
    G.edges.forEach(e => { const a = G.nodes.find(n=>n.id===e.from), b = G.nodes.find(n=>n.id===e.to); if (a && b && a.depth === b.depth - 1 && !(e.to in pred)) pred[e.to] = e.from; });
    if (only) { G.nodes.filter(n => n.flagged).forEach(n => { let c = n.id, g = 0; while (c !== undefined && g++ < 40) { keep.add(c); if (c === '') break; c = pred[c]; } }); }
    const nodesIn = G.nodes.filter(n => !only || keep.has(n.id));
    const set = new Set(nodesIn.map(n=>n.id));
    const nodes = nodesIn.map(n => {
      const r = n.risk || 0, col = n.root ? css('--brand') : n.flagged ? (r >= 80 ? '#dc2626' : r >= 60 ? '#ea580c' : '#ca8a04') : n.direct ? '#475569' : '#cbd5e1';
      const tree = gMode === 'tree';
      return { id: id(n.id), label: n.label, level: n.depth, shape: n.root ? 'box' : n.direct ? 'diamond' : 'dot',
        size: n.root ? 26 : tree ? (n.flagged ? 9 + r / 20 : n.direct ? 9 : 5) : (n.flagged ? 10 + r / 8 : n.direct ? 10 : 7), margin: n.root ? 12 : undefined,
        color: { background: col, border: n.dev ? '#94a3b8' : (n.root ? css('--brand') : '#ffffff'), highlight:{background: css('--brand-2'), border: css('--brand')} },
        borderWidth: n.dev ? 2 : 2, shapeProperties:{ borderDashes: n.dev ? [3,3] : false },
        font: { face:'Inter', size: n.root ? 15 : n.flagged ? 14 : n.direct ? 13 : 11, color: n.root ? '#fff' : n.flagged ? '#991b1b' : '#334155', strokeWidth: n.root ? 0 : 4, strokeColor:'#fff', bold: n.flagged },
        title: undefined };
    });
    const treeEdges = Object.entries(pred).filter(([c,p]) => set.has(c) && set.has(p)).map(([c,p]) => ({from:id(p), to:id(c)}));
    const edgesIn = gMode === 'tree' ? treeEdges : G.edges.filter(e => set.has(e.from) && set.has(e.to)).map(e => ({from:id(e.from), to:id(e.to)}));
    const edges = edgesIn.map((e,i) => ({ id:i, ...e, arrows:{to:{enabled:true, scaleFactor:.5}},
      color:{color: e.from === '__root__' ? '#a5b4fc' : '#cfd6e2', highlight: css('--brand')}, width: e.from === '__root__' ? 2.2 : 1.2, smooth: gMode==='tree' ? {type:'cubicBezier', forceDirection:'horizontal', roundness:.45} : {type:'continuous'} }));
    const opts = gMode === 'tree'
      ? { layout:{ hierarchical:{ direction:'LR', sortMethod:'directed', levelSeparation:270, nodeSpacing:52, treeSpacing:70, blockShifting:true, edgeMinimization:true, parentCentralization:true } }, physics:false, interaction:{hover:true, navigationButtons:false, keyboard:true} }
      : { physics:{ solver:'forceAtlas2Based', forceAtlas2Based:{gravitationalConstant:-70, springLength:110, avoidOverlap:.6}, stabilization:{iterations:400} }, interaction:{hover:true} };
    const net = new vis.Network($('#net'), {nodes:new vis.DataSet(nodes), edges:new vis.DataSet(edges)}, opts);
    net.once(gMode === 'tree' ? 'afterDrawing' : 'stabilizationIterationsDone', () => { if (gMode !== 'tree') net.setOptions({physics:false}); net.fit({animation:{duration:500}}); });
    const pathTo = k => { const p = [k]; let c = k, g = 0; while (c !== '' && pred[c] !== undefined && g++ < 40) { c = pred[c]; p.unshift(c); } return p; };
    const show = vid => { const raw = vid === '__root__' ? '' : vid; const n = G.nodes.find(x => x.id === raw); if (!n) return;
      const inv = (R.inventory||[]).find(c => c.lock_path === raw); const fs = F.filter(f => f.component === n.label).sort((a,b)=>b.risk_score-a.risk_score);
      const p = pathTo(raw); net.selectNodes(p.map(id)); net.focus(vid, {scale: 1.0, animation:{duration:500}});
      $('#gp').innerHTML = `<div class="eyebrow">Package</div><h3 class="mono" style="font-size:15px;margin:6px 0">${esc(n.label)}</h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${n.root?'<span class="chip">your application</span>':n.direct?'<span class="chip">chosen by developers</span>':'<span class="chip">pulled in automatically</span>'}${n.root?'':scopeChip(n.dev?'dev':'runtime')}</div>
        ${inv?`<div class="small muted">Downloaded from <span class="mono">${esc(inv.source||'bundled')}</span> · level ${inv.depth} in the tree</div>`:''}
        ${whyBox(n)}
        <div class="eyebrow" style="margin:14px 0 6px">How it got into your app</div>${pathHTML(p.map(x => G.nodes.find(y=>y.id===x)?.label || x))}
        <div class="eyebrow" style="margin:14px 0 6px">Findings (${fs.length})</div>${fs.slice(0,10).map(f=>`<div class="fitem" data-fid="${esc(f.id)}" style="padding:8px 0;border-left:0">${badge(f)}<div class="t" style="font-size:12.5px">${esc(f.title)}</div></div>`).join('') || '<div class="small muted">No issues found for this package.</div>'}`;
      bindFindingLinks($('#gp')); };
    net.on('click', e => e.nodes.length && show(e.nodes[0]));
    $('#gq').onchange = e => { const n = G.nodes.find(x => x.label === e.target.value); if (n) show(id(n.id)); };
    $('#gFit').onclick = () => net.fit({animation:{duration:400}});
  }
}

/* "why is this node direct / transitive?" with the file evidence it came from */
function whyBox(n){
  if (n.root) return `<div class="why direct"><h5>■ Your application</h5>The root of the tree, read from <span class="fname">package.json</span> (name and version).</div>`;
  const name = n.label.replace(/@[^@]*$/, ''), ver = n.label.slice(name.length + 1);
  const lock = `<div class="src"><span class="fname">🔒 package-lock.json</span>→ <code>packages["${esc(n.lock_path)}"]</code> → version <code>${esc(ver)}</code></div>`;
  const req = (n.required_by||[]).map(r => `<li><code>${esc(r.label)}</code> asks for <code>"${esc(name)}": "${esc(r.range)}"</code></li>`).join('');
  const more = (n.required_by_count||0) > (n.required_by||[]).length ? `<li class="muted">…and ${n.required_by_count - n.required_by.length} more</li>` : '';
  const rule = `<div class="rule">Rule: <b>direct</b> = listed in package.json <i>and</i> installed at <code>node_modules/&lt;name&gt;</code>. Everything else is <b>transitive</b>.</div>`;
  if (n.direct) return `<div class="why direct"><h5>◆ Why is this direct?</h5>The developers chose it themselves.
    <div class="src"><span class="fname">📄 package.json</span>→ <code>${esc(n.declared_in||'dependencies')}</code> → <code>"${esc(name)}": "${esc(n.spec)}"</code></div>${lock}
    ${n.required_by_count ? `<div style="margin-top:6px"><b>Also transitive:</b> ${n.required_by_count} other package(s) need it too<ul>${req}${more}</ul></div>` : ''}${rule}</div>`;
  return `<div class="why trans"><h5>● Why is this transitive?</h5>Nobody listed it in package.json. It came in because ${n.required_by_count === 1 ? 'another package' : n.required_by_count + ' packages'} asked for it.
    <div class="src"><span class="fname">📄 package.json</span>→ <span class="muted">not listed</span></div>${lock}
    <div style="margin-top:6px"><b>Required by</b><ul>${req}${more}</ul></div>${rule}</div>`;
}

/* ================= 5b. FULL GRAPH (deptree engine) =================
   Every manifest in the repo (npm, containers, CI ...) as one radial map: project -> ecosystem
   groups -> manifests -> packages by depth. Guardian findings are overlaid on the nodes. */
(function(){
  const PROJ = '__project__', GRP = '__group__:', MRING = 2;
  const GL = {npm:'npm', docker:'containers', 'github-actions':'CI workflows', pypi:'python', golang:'go', maven:'java', gem:'ruby', composer:'php', cargo:'rust', nuget:'.NET'};
  const RISK = ['Critical','High','Medium','Low'];
  const RANK = {Critical:4, High:3, Medium:2, Low:1, Info:0};
  const S = {D:null, slug:null, N:{}, OUT:{}, IN:{}, L:null, sel:null, hover:null, HI:null, cam:{k:1,x:0,y:0}, view:'graph', CV:{}, byNode:{}, sortK:'risk', sortD:-1};
  const syn = id => id === PROJ || id.startsWith(GRP);
  const lab = n => n.id === PROJ ? S.D.project : n.type === 'group' ? n.name : n.type === 'application' ? n.id.replace(/^app:[^/]+\//, '') : n.name;
  const full = n => lab(n) + (n.version && n.type !== 'application' && !syn(n.id) ? '@' + n.version : '');
  const short = n => { const p = lab(n).split('/'), last = p[p.length-1]; return p.length > 1 && /^(package\.json|Dockerfile.*|docker-compose.*|pyproject\.toml|go\.mod|pom\.xml|requirements.*\.txt)$/.test(last) ? p.slice(-2).join('/') : last; };

  function colors(el){ const cs = getComputedStyle(el); ['bg','panel','ink','muted','faint','line','accent','edge','crit','high','med','low','prod','dev','opt','img','ci','root'].forEach(k => S.CV[k] = cs.getPropertyValue('--fg-' + k).trim()); }

  // ---- Guardian findings -> graph nodes
  function mapFindings(){
    S.byNode = {};
    const idx = {};
    for (const n of S.D.nodes) {
      const keys = [];
      if (n.type === 'package' && n.version) keys.push(`${n.name}@${n.version}`);
      if (n.type === 'application') { keys.push(lab(n)); if (n.version) keys.push(`${n.name}@${n.version}`); }
      if (n.type === 'container-image') keys.push(n.name, `${n.name}:${n.version}`);
      keys.forEach(k => (idx[k] ||= []).push(n.id));
    }
    for (const f of F) for (const id of (idx[f.component] || [])) (S.byNode[id] ||= []).push(f);
    for (const k in S.byNode) S.byNode[k].sort((a,b) => b.risk_score - a.risk_score);
  }
  const worst = id => { const fs = S.byNode[id]; return fs && fs.length ? fs[0].risk_level : null; };

  function scopeColor(n){
    const s = n.scopes || [];
    if (n.type === 'container-image') return S.CV.img;
    if (n.type === 'github-action') return S.CV.ci;
    if (s.includes('prod') || s.includes('runtime')) return S.CV.prod;
    if (s.includes('optional') || s.includes('peer')) return S.CV.opt;
    return S.CV.dev;
  }
  function color(n){
    if (syn(n.id) || n.type === 'application') { const w = worst(n.id); return w && $('#fgColor').value === 'risk' ? riskColor(w) : S.CV.root; }
    const mode = $('#fgColor').value;
    if (mode === 'risk') { const w = worst(n.id); return w ? riskColor(w) : (n.scopes||[]).some(s => s==='prod'||s==='runtime') ? '#9ca3af' : '#d4d4d8'; }
    if (mode === 'depth') { const t = Math.min(1, (S.L.depth[n.id] - MRING - 1) / Math.max(1, S.L.maxDepth - MRING - 1)); return `hsl(220 45% ${30 + t * 45}%)`; }
    return scopeColor(n);
  }
  const riskColor = r => ({Critical:S.CV.crit, High:S.CV.high, Medium:S.CV.med, Low:S.CV.low}[r] || S.CV.faint);

  function visible(e){
    if (syn(e.from)) { if (!$('#fgEco').value) return true; return (S.OUT[e.to]||[]).some(visible); }
    if (!$('#fgDev').checked && e.scope === 'dev') return false;
    const f = $('#fgEco').value, t = S.N[e.to];
    if (f && t && t.type !== 'application' && t.ecosystem !== f) return false;
    if ($('#fgRisky').checked && t && t.type !== 'application' && !S.riskyKeep.has(e.to)) return false;
    return true;
  }

  // keep only nodes that are risky or lie on a path to a risky node
  function computeRiskyKeep(){
    const keep = new Set(), q = Object.keys(S.byNode).filter(id => S.N[id]);
    q.forEach(id => keep.add(id));
    while (q.length) { const n = q.pop(); for (const e of S.IN[n] || []) if (!keep.has(e.from)) { keep.add(e.from); q.push(e.from); } }
    S.riskyKeep = keep;
  }

  function layout(fit){
    const depth = {[PROJ]:0}, parent = {}, kids = {[PROJ]:[]}, order = [PROJ];
    for (let i = 0; i < order.length; i++) { const n = order[i];
      for (const e of S.OUT[n] || []) { if (e.to in depth || !visible(e)) continue; depth[e.to] = depth[n] + 1; parent[e.to] = n; kids[e.to] = []; kids[n].push(e.to); order.push(e.to); } }
    const w = {};
    for (let i = order.length - 1; i >= 0; i--) { const n = order[i]; w[n] = kids[n].length ? kids[n].reduce((a,c) => a + w[c], 0) : 1; }
    const cnt = []; order.forEach(n => cnt[depth[n]] = (cnt[depth[n]] || 0) + 1);
    const radii = [0]; for (let d = 1; d < cnt.length; d++) radii[d] = Math.max(radii[d-1] + (d === 1 ? 110 : d === 2 ? 120 : 110), cnt[d] * 9 / (2 * Math.PI));
    const GAP = .09, span = {[PROJ]:[-Math.PI/2 + GAP, 3*Math.PI/2 - GAP]}, pos = {};
    for (const n of order) { const [a0, a1] = span[n]; const wt = c => depth[n] < MRING ? Math.sqrt(w[c]) : w[c];
      const tot = kids[n].reduce((a,c) => a + wt(c), 0) || 1; let cur = a0;
      for (const c of kids[n]) { const s = (a1 - a0) * wt(c) / tot; span[c] = [cur, cur + s]; cur += s; }
      const a = (a0 + a1) / 2, r = radii[depth[n]]; pos[n] = {x: Math.cos(a) * r, y: Math.sin(a) * r, a}; }
    const dependents = {}; for (const n of order) dependents[n] = (S.IN[n] || []).filter(e => e.from in depth && !syn(e.from)).length;
    S.L = {pos, depth, parent, order, radii, dependents, maxDepth: cnt.length - 1};
    if (S.sel && !(S.sel in depth)) S.sel = null;
    highlight(); legend();
    if (fit) fitView(); else draw();
  }
  const radius = id => { if (id === PROJ) return 9; const n = S.N[id]; if (n.type === 'group') return 6.5; if (n.type === 'application') return 6;
    const base = 2.6 + Math.min(9, Math.sqrt(S.L.dependents[id] || 0) * 1.25); return worst(id) ? base + 1.5 : base; };

  function highlight(){
    if (!S.sel || !S.L || !(S.sel in S.L.depth)) { S.HI = null; return; }
    const anc = new Set([S.sel]), desc = new Set([S.sel]); let q = [S.sel];
    while (q.length) { const n = q.pop(); for (const e of S.IN[n] || []) if (!anc.has(e.from) && e.from in S.L.depth && visible(e)) { anc.add(e.from); q.push(e.from); } }
    q = [S.sel];
    while (q.length) { const n = q.pop(); for (const e of S.OUT[n] || []) if (!desc.has(e.to) && e.to in S.L.depth && visible(e)) { desc.add(e.to); q.push(e.to); } }
    S.HI = {anc, desc};
  }

  // ---- canvas
  let raf = 0; const draw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); };
  function canvas(){ return document.getElementById('fgCanvas'); }
  function fitView(){ const c = canvas(); if (!c) return; const r = c.getBoundingClientRect(); const R0 = (S.L.radii[S.L.radii.length-1] || 100) + 60;
    S.cam.k = Math.min(r.width, r.height) / (2 * R0); S.cam.x = r.width / 2; S.cam.y = r.height / 2; draw(); }
  function focus(id, zoom){ const c = canvas(), p = S.L && S.L.pos[id]; if (!c || !p) return; const r = c.getBoundingClientRect();
    if (zoom) S.cam.k = Math.max(S.cam.k, 1.2); S.cam.x = r.width / 2 - p.x * S.cam.k; S.cam.y = r.height / 2 - p.y * S.cam.k; draw(); }
  function paint(){
    const c = canvas(); if (!c || !S.L) return; const ctx = c.getContext('2d');
    const dpr = devicePixelRatio || 1, W = c.width / dpr, H = c.height / dpr, k = S.cam.k, px = 1 / k, P = S.L.pos, CV = S.CV;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle = CV.bg; ctx.fillRect(0,0,W,H);

/* ================= 6. VULNERABILITIES ================= */
function vulns(el){
  const V = F.filter(f => ['vulnerability','malicious-package'].includes(f.category));
  const inv = {}; (R.inventory||[]).forEach(c => { if (!(c.label in inv) || c.depth < inv[c.label].depth) inv[c.label] = c; });
  const pk = {}; V.forEach(f => { const p = pk[f.component] = pk[f.component] || {label:f.component, list:[], worst:0, mal:false, scope:f.scope, fix:new Set()};
    p.list.push(f); p.worst = Math.max(p.worst, f.risk_score); p.mal = p.mal || f.category==='malicious-package'; if (f.scope==='runtime') p.scope='runtime'; if (f.fixed_version) p.fix.add(f.fixed_version.split(',')[0]); });
  const SEVN = {CRITICAL:'Critical', HIGH:'High', MEDIUM:'Medium', LOW:'Low'};
  const worstSev = list => list.map(f => SEVN[f.severity] || 'Low').sort((a,b) => LV.indexOf(a) - LV.indexOf(b))[0];
  const P = Object.values(pk).map(p => ({...p, depth: inv[p.label]?.depth || 1, n: p.list.length, sev: worstSev(p.list)}));
  const sevCount = {}; V.forEach(f => { const s = f.severity; sevCount[s] = (sevCount[s]||0)+1; });
  const mals = P.filter(p => p.mal);
  el.innerHTML = `<div class="vhead"><div><h2>Vulnerability map</h2><p>${fmt(V.length)} known advisories across ${P.length} packages, placed by how deep they sit and whether they ship to production.</p></div>
      <div class="seg"><button class="on" data-v="map">🫧 Map</button><button data-v="table">☰ Table</button></div></div>
    ${plain('Each bubble is a <b>package with known problems</b>. <b>Bigger</b> = more problems. <b>Redder</b> = more severe. <b>Left</b> = chosen directly by the developers (easy to fix); <b>right</b> = buried deep inside other packages. The <b>top lane</b> ships to production, which matters most.')}

    <div class="grid g4 sevcards" style="margin-bottom:16px">${[['CRITICAL','Critical'],['HIGH','High'],['MEDIUM','Medium'],['LOW','Low']].map(([s,l])=>`<div class="card"><span class="eyebrow">${l}</span><b style="color:${LVC[l]}">${fmt(sevCount[s]||0)}</b><span class="xs muted">advisories</span></div>`).join('')}</div>

  const drawMap = () => {

    const maxDepth = d3.max(P, p => p.depth) || 5;

    const lanes = {runtime: m.t + (H - m.t - m.b) * .27, dev: m.t + (H - m.t - m.b) * .77};
    const r = d3.scaleSqrt().domain([1, d3.max(P, p => p.n) || 1]).range([6, 26]);
    const nodes = P.map(p => ({...p, x: x(p.depth), y: lanes[p.scope==='runtime'?'runtime':'dev'], rr: r(p.n)}));
    const sim = d3.forceSimulation(nodes).force('x', d3.forceX(d => x(d.depth)).strength(1)).force('y', d3.forceY(d => lanes[d.scope==='runtime'?'runtime':'dev']).strength(.12)).force('c', d3.forceCollide(d => d.rr + 1.5)).stop();
    for (let i = 0; i < 260; i++) sim.tick();
    const svg = d3.select(box).append('svg').attr('viewBox', `0 0 ${Wd} ${H}`).attr('height', H);

      svg.append('rect').attr('x', 10).attr('y', m.t + i*laneH).attr('width', Wd-20).attr('height', laneH - 6).attr('rx', 14).attr('fill', c);
      svg.append('text').attr('x', 24).attr('y', m.t + i*laneH + 26).text(t).attr('font-size', 13).attr('font-weight', 700).attr('fill', '#334155');
      svg.append('text').attr('x', 24).attr('y', m.t + i*laneH + 44).text(`${nodes.filter(n => (n.scope==='runtime'?'runtime':'dev')===k).length} packages`).attr('font-size', 12).attr('fill', '#64748b');
    });
    const ax = svg.append('g').attr('transform', `translate(0,${H - m.b + 6})`);
    d3.range(1, maxDepth + 1).forEach(d => { ax.append('text').attr('x', x(d)).attr('y', 14).attr('text-anchor','middle').attr('font-size', 11.5).attr('fill','#64748b').text(d);
      svg.append('line').attr('x1', x(d)).attr('x2', x(d)).attr('y1', m.t).attr('y2', H - m.b).attr('stroke', '#e2e8f0').attr('stroke-dasharray', '2,4'); });
    ax.append('text').attr('x', m.l).attr('y', 36).attr('font-size', 12).attr('fill', '#334155').attr('font-weight', 600).text('← chosen directly by developers');
    ax.append('text').attr('x', Wd - m.r).attr('y', 36).attr('text-anchor','end').attr('font-size', 12).attr('fill', '#334155').attr('font-weight', 600).text('buried deep inside other packages →');
    const g = svg.append('g').selectAll('g').data(nodes).join('g').attr('transform', d => `translate(${d.x},${d.y})`).style('cursor','pointer');
    g.append('circle').attr('r', 0).attr('fill', d => d.mal ? '#7f1d1d' : LVC[d.sev]).attr('fill-opacity', .85).attr('stroke', '#fff').attr('stroke-width', 1.5)
      .transition().duration(700).delay((d,i) => i*4).attr('r', d => d.rr);
    g.filter(d => d.mal).append('text').text('☠').attr('text-anchor','middle').attr('dy','.35em').attr('font-size', d => d.rr).attr('fill','#fff');
    g.filter(d => d.rr > 15 && !d.mal).append('text').text(d => d.n).attr('text-anchor','middle').attr('dy','.35em').attr('font-size', 11).attr('font-weight', 700).attr('fill', '#fff');
    g.on('mousemove', (e,d) => showTip(e, `<b>${esc(d.label)}</b><br>${d.n} advisor${d.n>1?'ies':'y'} · worst ${d.sev}${d.mal?' · <b style="color:#fca5a5">MALWARE</b>':''}<br>level ${d.depth} · ${d.scope==='runtime'?'ships to production':'dev only'}${d.fix.size?`<br>fix: upgrade to ${esc([...d.fix][0])}`:''}<br><i style="opacity:.7">click for details</i>`)).on('mouseleave', hideTip)
     .on('click', (e,d) => { hideTip(); const fs = d.list.sort((a,b)=>b.risk_score-a.risk_score);
       openDrawer(d.label, `<div style="padding:20px"><h3 class="mono" style="font-size:18px">${esc(d.label)}</h3><p class="muted">${d.n} known problem(s) · ${d.scope==='runtime'?'ships to production':'developer tool only'}</p>${pathHTML(fs[0].dependency_paths[0]||[d.label])}<div style="margin-top:12px">${fs.map(f=>`<div class="fitem" data-fid="${esc(f.id)}"><div class="top">${badge(f)}<span class="chip mono">${esc(f.vuln_ids[0])}</span>${f.fixed_version?`<span class="chip">fix: ${esc(f.fixed_version.split(',')[0])}</span>`:''}</div><div class="t">${esc(f.title)}</div></div>`).join('')}</div></div>`); });
  };

  el.querySelectorAll('.seg button').forEach(b => b.onclick = () => { el.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x===b));
    if (b.dataset.v === 'map') { $('#vbox').innerHTML = '<div id="swarm"></div>'; drawMap(); } else drawTable(); });

}

/* ================= 7. SUSPICIOUS CHANGES (case files) ================= */
const CASE = {
  TYPO:['🎭','#fdf2f8','Look-alike name','This name is one letter away from a very popular package. Attackers publish look-alikes hoping someone mistypes.'],
  'DIFF-INT':['🔓','#fdecec','Contents changed silently','Same version number, different contents. Like a sealed jar whose seal was replaced: someone repacked it.'],
  'DIFF-ADD':['👻','#fdecec','Appeared from nowhere','A package showed up that nobody added on purpose.'],
  'DIFF-VER':['🔁','#eef0ff','Version changed','A package version changed compared with the last known-good copy.'],
  SRC:['🌐','#fff7ed','Unusual download source','Downloaded from somewhere other than the official npm store, so the usual safety guarantees do not apply.'],
  INSTALL:['⚡','#fff7ed','Runs code on install','This package runs its own program the moment it is installed, before anyone has reviewed it.'],
  SCRIPT:['💣','#fdecec','Install script runs internet code','The project downloads a script from the internet and runs it during installation.'],
  INT:['❓','#fff7ed','No fingerprint','There is no content hash, so tampering would go unnoticed.'],
  SPEC:['🎲','#fdf6e3','Floating version','Each fresh install may pull different code ("latest" or a URL instead of a fixed version).'],
  'LOCK-SHA1':['🔑','#f1f5f9','Weak fingerprints','Old SHA-1 fingerprints are easier to fake than modern ones.'],
  DOCKER:['🐳','#e0f2fe','Risky image build',''],
  CI:['⚙️','#ede9fe','Risky CI pipeline',''],
};
const RULE_PLAIN = {DF001:'The base image can change any day without anyone noticing.', DF002:'Tags can be moved; only a digest guarantees the same image.', DF003:'This runtime no longer gets security fixes.', DF004:'A script from the internet runs while the image is built.', DF005:'The app runs with full administrator rights inside the container.', DF006:'The build may install versions different from the lockfile.', DF007:'A file is fetched from the internet without verification.',
  CI001:'The CI step uses someone else\'s code that can change without notice.', CI002:'Anyone opening a pull request could run code with the repository\'s secrets.', CI003:'The pipeline downloads and runs a script from the internet.', CI005:'The pipeline token may have more permissions than it needs.'};
const caseType = f => f.id.startsWith('DIFF-INT') ? 'DIFF-INT' : f.id.startsWith('DIFF-ADD') ? 'DIFF-ADD' : f.id.startsWith('DIFF-VER') ? 'DIFF-VER' : f.id.startsWith('LOCK-SHA1') ? 'LOCK-SHA1' : f.id.startsWith('DOCKER') || f.id.startsWith('IMAGE') ? 'DOCKER' : f.id.split('-')[0];
function typoVisual(f){
  const d = f.evidence[0].data || {}, dl = (f.evidence[1]||{}).data || {}; const a = f.component.split('@')[0], b = d.lookalike_of || '';
  const mark = (s, o) => { let out = '', j = 0; for (let i = 0; i < s.length; i++) { if (s[i] === o[j]) { out += esc(s[i]); j++; } else out += `<span class="x">${esc(s[i])}</span>`; } return out; };
  const lg = v => Math.log10((v||0) + 1), mx = Math.max(lg(dl.downloads), lg(dl.target_downloads), 1);
  return `<div class="namecmp"><div><b>${mark(a,b)}</b><span class="lbl">in your app</span></div><div style="background:var(--ev-soft)"><b>${esc(b)}</b><span class="lbl">the real one</span></div></div>
    ${dl.target_downloads!=null?`<div style="margin-top:10px" class="xs muted">Weekly downloads</div><div class="dlbar"><span class="mono">${esc(a)}</span><div class="t"><div style="width:${100*lg(dl.downloads)/mx}%;background:var(--crit)"></div></div><b>${fmt(dl.downloads)}</b></div><div class="dlbar"><span class="mono">${esc(b)}</span><div class="t"><div style="width:${100*lg(dl.target_downloads)/mx}%;background:var(--ev)"></div></div><b>${fmt(dl.target_downloads)}</b></div>`:''}`;
}
function caseVisual(f){
  const t = caseType(f), d = f.evidence[0]?.data || {};
  if (t === 'TYPO') return typoVisual(f);
  if (t === 'DIFF-INT') return `<div class="hashcmp"><div class="old"><span>Trusted copy</span>${esc(d.baseline_resolved)}<br>${esc((d.baseline_integrity||'').slice(0,60))}…</div><div class="nw"><span>Now</span>${esc(d.current_resolved)}<br>${esc((d.current_integrity||'').slice(0,60))}…</div></div>`;
  if (t === 'SRC') { const u = d.resolved || ''; const h = u.split('/')[2] || u; return `<div class="urlbox">${esc(u).replace(esc(h), `<span class="h">${esc(h)}</span>`)}</div><div class="xs muted">expected: registry.npmjs.org</div>`; }
  if (t === 'SCRIPT') return `<div class="term"><span class="p">$ npm install</span>\n→ ${esc(d.script)}: ${esc(d.command)}</div>`;
  if (t === 'INSTALL') return `<div class="term"><span class="p">$ npm install</span>\n→ ${esc(f.component)} runs its own install program automatically</div>`;
  if (t === 'DIFF-ADD' && f.dependency_paths[0]) return pathHTML(f.dependency_paths[0]);
  if (d.snippet) { const s = d.snippet; return `<div class="snip">${s.lines.map((l,i)=>`<div class="${s.start+i===s.hit?'hit':''}"><span class="no">${s.start+i}</span><span> ${esc(l)}</span></div>`).join('')}</div>`; }
  if (t === 'SPEC') return `<div class="term">"${esc(f.component)}": "${esc(d.spec)}"</div>`;
  return '';
}
function tamper(el){
  const T = F.filter(f => !['vulnerability','malicious-package'].includes(f.category));
  const filters = [['all','All'],['new','🆕 New since baseline'],['names','🎭 Names'],['tamper','🔓 Tampering'],['scripts','⚡ Install scripts'],['build','🐳 Image build'],['ci','⚙️ CI/CD'],['hygiene','🧹 Hygiene']];
  const test = {all:()=>true, new:f=>f.changed, names:f=>caseType(f)==='TYPO', tamper:f=>['DIFF-INT','DIFF-ADD','DIFF-VER','SRC','INT'].includes(caseType(f)), scripts:f=>['INSTALL','SCRIPT'].includes(caseType(f)), build:f=>caseType(f)==='DOCKER', ci:f=>caseType(f)==='CI', hygiene:f=>['SPEC','LOCK-SHA1'].includes(caseType(f))};
  let cur = T.some(f=>f.changed) ? 'new' : 'all';
  el.innerHTML = `<div class="vhead"><div><h2>Suspicious changes: the case files</h2><p>Problems that no vulnerability database knows about yet. Each card shows the evidence the way an investigator would.</p></div></div>
    ${plain('Known-bad lists only catch <i>yesterday\'s</i> attacks. These are <b>warning signs of tampering</b>: a fake name, a changed seal, a secret installer, a risky build step. Click a card for the full evidence and the AI\'s reasoning.')}
    <div class="fchips" id="cf" style="margin-bottom:16px"></div><div class="cases" id="cases"></div>`;
  const draw = () => {
    $('#cf').innerHTML = filters.map(([k,l]) => { const n = T.filter(test[k]).length; return n || k==='all' ? `<button class="fchip ${k===cur?'on':''}" data-k="${k}">${l} · ${n}</button>` : ''; }).join('');
    $('#cf').querySelectorAll('.fchip').forEach(b => b.onclick = () => { cur = b.dataset.k; draw(); });
    $('#cases').innerHTML = T.filter(test[cur]).map(f => { const t = caseType(f), c = CASE[t] || ['🔎','#f1f5f9','Finding',''];
      const rule = (f.evidence[0]?.source.match(/(DF|CI)\d{3}/)||[])[0];
      const pw = (f.ai && f.ai.source?.startsWith('AI') ? f.ai.why_it_matters : null) || RULE_PLAIN[rule] || c[3];
      return `<div class="card case" data-fid="${esc(f.id)}"><div class="ch"><div class="ct" style="background:${c[1]}">${c[0]}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(c[2])}</div><h4>${esc(f.title)}</h4></div></div>
        <div class="cb">${caseVisual(f)}<div class="pw">${f.ai && f.ai.source?.startsWith('AI') ? '<b style="color:var(--ai)">✦ AI:</b> ' : ''}${esc(pw)}</div></div>
        <div class="cf"><span>${badge(f)} ${f.changed?'<span class="chip new">NEW</span>':''}</span><span class="mono">${esc(f.location)}</span></div></div>`; }).join('') || '<div class="empty">Nothing in this group.</div>';
    bindFindingLinks($('#cases'));
  };
  draw();
}

/* ================= 8. FINDINGS ================= */
function gauge(s){ const c = s>=80?'#dc2626':s>=60?'#ea580c':s>=35?'#ca8a04':'#2563eb'; return `<div class="gauge" style="background:conic-gradient(${c} ${s*3.6}deg,var(--line-2) 0)"><span style="color:${c}">${s}</span></div>`; }
function rationale(list){ return list.map(r => { const m = r.match(/^([+-]\d+)\s+(.*)$/); if (m) return `<div><span class="d ${m[1][0]==='+'?'plus':'minus'}">${m[1]}</span><span>${esc(m[2])}</span></div>`;
  const b = r.match(/^base (\d+)\s+(.*)$/); if (b) return `<div><span class="d">${b[1]}</span><span>starting point, ${esc(b[2])}</span></div>`; return `<div><span class="d">•</span><span>${esc(r)}</span></div>`; }).join(''); }

    <h3>${esc(f.title)}</h3><div class="small muted mono">${esc(f.location)}${f.vuln_ids.length?' · '+esc(f.vuln_ids.slice(0,4).join(', ')):''}</div></div>
  <div class="dbody">
    <dl class="dl"><dt>Component</dt><dd><code>${esc(f.component)}</code></dd>
      ${f.dependency_paths.length?`<dt>How it got in</dt><dd>${f.dependency_paths.slice(0,3).map(pathHTML).join('')}</dd>`:''}
      ${f.cvss!=null?`<dt>CVSS</dt><dd>${f.cvss}</dd>`:''}${f.fixed_version?`<dt>Fixed in</dt><dd><code>${esc(f.fixed_version)}</code></dd>`:''}

      ${f.references.length?`<div class="xs" style="margin-top:8px">${f.references.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,'').slice(0,60))}</a>`).join(' · ')}</div>`:''}</div>
    ${a?`<div class="aiblk"><div class="sec-t">✦ ${isLLM?'AI reasoning · '+esc(R.ai.model):'Explanation · template (AI unavailable)'}${a.ai_confidence&&a.ai_confidence!=='n/a'?' · confidence '+esc(a.ai_confidence):''}</div>
      <dl class="aiq"><dt>What it means</dt><dd>${esc(a.explanation)}</dd><dt>Why it matters here</dt><dd>${esc(a.why_it_matters)}</dd>${a.risk_reasoning?`<dt>Risk reasoning</dt><dd>${esc(a.risk_reasoning)}</dd>`:''}
      <dt>Attack scenario</dt><dd>${esc(a.likely_attack_scenario)}</dd><dt>Next step (Day 2)</dt><dd>${esc(a.suggested_next_step)} <span class="muted small">· needs human approval</span></dd>
      ${a.evidence_used?.length?`<dt>Evidence relied on</dt><dd>${a.evidence_used.map(s=>`<span class="chip">${esc(s)}</span>`).join(' ')}</dd>`:''}</dl>
      ${isLLM?`<div class="guard"><span>Guardrails:</span><span><b>✔</b> ${a.unverified_ids_removed.length} invented IDs</span><span><b>✔</b> ${(a.evidence_claims_rejected||[]).length} unsupported claims</span><span><b>✔</b> score not changed by AI</span></div>`:''}</div>`
     : `<div class="small muted">Not among the top ${R.ai.sent_findings} sent to the AI (free-tier budget). The evidence and score above are complete.</div>`}

let fs = {q:'', l:'', c:'', s:'', ai:true, nw:false}, selF = null;

/* ================= 9. REPORT ================= */
function report(el){
  const W = R.checkpoint.what_is_in_the_app, CH = R.checkpoint.what_changed || {}, L = R.checkpoint.what_looks_risky.by_risk_level, aiF = F.filter(f=>f.ai), aiOn = R.ai.mode==='llm';
  el.innerHTML = `<div class="noprint" style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px"><a class="btn" href="/api/report/${SLUG}/output/guardian_report.json?dl=1">⬇ JSON</a><a class="btn" href="/api/report/${SLUG}/output/sbom.cdx.json?dl=1">⬇ SBOM</a><button class="btn primary" onclick="window.print()">Print / Save as PDF</button></div>
  <article class="card doc"><div class="eyebrow" style="color:var(--brand)">Guardian Report · Day 1 · Detection & Evidence</div>
    <h1 style="margin-top:6px">Supply-chain assessment of ${esc(R.target.name)}@${esc(R.target.version)}</h1>
    <div class="dmeta"><div><b>Prepared by</b>${esc(R.tool.team)}</div><div><b>Date</b>${new Date(R.generated_at).toLocaleString()}</div><div><b>Tool</b>Supply Chain Guardian v${esc(R.tool.version)}</div>
      <div><b>Repository</b>${esc(R.target.upstream)}${R.target.commit?' @ '+esc(R.target.commit):''}</div><div><b>Compared with</b>${R.baseline?esc(CH.baseline_label||'baseline'):'first scan (no baseline)'}</div><div><b>AI model</b>${aiOn?esc(R.ai.model):'not used'}</div></div>
    <h2>1. Executive summary</h2><p>${esc(R.ai.executive_summary || `${W.total_components} components; ${L.Critical} critical findings.`)}</p>${R.ai.executive_summary?'<p class="xs muted">Drafted by AI from verified evidence; all figures are tool-generated.</p>':''}
    <h2>2. Key figures</h2><table class="tbl"><tbody>
      <tr><td>Components (direct / transitive)</td><td><b>${fmt(W.total_components)}</b> (${W.direct} / ${fmt(W.transitive)})</td></tr>
      <tr><td>Shipped to production</td><td>${W.runtime}</td></tr><tr><td>Known advisories (OSV.dev)</td><td>${R.vulnerability_scan.advisories} on ${R.vulnerability_scan.vulnerable_packages} packages</td></tr>
      <tr><td>Findings by initial risk</td><td>${LV.map(l=>`<span class="badge b-${l}" style="margin-right:4px">${l} ${L[l]}</span>`).join('')}</td></tr>
      <tr><td>New since baseline</td><td>${F.filter(f=>f.changed).length}</td></tr><tr><td>Container images</td><td class="mono small">${[...new Set(W.container_images)].join(', ')}</td></tr><tr><td>CI workflows</td><td class="mono small">${W.ci_workflows.length}</td></tr></tbody></table>
    ${R.baseline?`<h2>3. What changed</h2><ul>${[...(CH.added||[]).map(x=>`New package <code>${esc(x)}</code>`),...(CH.integrity_changed||[]).map(x=>`Contents changed, same version: <code>${esc(x)}</code>`),...(CH.source_changed||[]).map(x=>`Download source changed: <code>${esc(x)}</code>`),...(CH.scripts_changed||[]).map(x=>`Changed: ${esc(x)}`),...(CH.new_images||[]).map(x=>`New base image <code>${esc(x)}</code>`),...(CH.new_workflows||[]).map(x=>`New workflow <code>${esc(x)}</code>`)].map(x=>`<li>${x}</li>`).join('')||'<li>No changes</li>'}</ul>`:''}
    <h2>${R.baseline?4:3}. Prioritised findings</h2><table class="tbl"><thead><tr><th>#</th><th>Risk</th><th>Finding</th><th>Component</th><th>Evidence</th></tr></thead><tbody>${F.slice(0,15).map((f,i)=>`<tr><td>${i+1}</td><td>${badge(f)}</td><td>${f.changed?'<span class="chip new">NEW</span> ':''}${esc(f.title)}</td><td class="mono xs">${esc(f.component)}</td><td class="xs">${esc([...new Set(f.evidence.map(e=>e.source))].join(', '))}</td></tr>`).join('')}</tbody></table>
    ${R.ai.prioritisation_rationale?`<p><b>Prioritisation rationale (AI):</b> ${esc(R.ai.prioritisation_rationale)}</p>`:''}
    <h2>${R.baseline?5:4}. Analysed findings</h2>${aiF.map((f,i)=>`<div style="margin:0 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;break-inside:avoid"><div style="display:flex;justify-content:space-between;gap:10px"><b>${i+1}. ${esc(f.title)}</b>${badge(f)}</div><div class="xs muted mono">${esc(f.component)} · ${esc(f.location)}</div>${f.dependency_paths[0]?pathHTML(f.dependency_paths[0]):''}
      <p class="small" style="margin:6px 0"><b style="color:var(--ev)">Evidence:</b> ${f.evidence.map(e=>`[${esc(e.source)}] ${esc(e.detail)}`).join(' ')}</p><p class="small" style="margin:6px 0"><b style="color:var(--ai)">Reasoning:</b> ${esc(f.ai.risk_reasoning||f.ai.why_it_matters)}</p><p class="small" style="margin:6px 0"><b>Next step:</b> ${esc(f.ai.suggested_next_step)}</p></div>`).join('')}
    <h2>Method</h2><p>Components were resolved from the npm lockfile${R.discovery?.lockfile?.status==='generated'?' (computed with npm --package-lock-only --ignore-scripts because the repository has none)':''} using Node's module-resolution rules and exported as CycloneDX 1.5, cross-checked with Syft. Vulnerabilities and malware come from OSV.dev, and the container base image was scanned with Trivy. Non-CVE risks were found by typosquat analysis, integrity and source checks, the baseline diff, and Dockerfile and GitHub Actions rules. Risk scores are deterministic.</p>
    <h2>Responsible AI</h2><p>AI explained only the top ${R.ai.sent_findings} findings, from evidence alone (no source code, no secrets). Invented advisory IDs are removed, claimed evidence is checked, and AI never changes scores or code. Remediation requires human approval.</p>
    <h2>Review and approval (Day 2)</h2><div class="sign"><div>Security reviewer<br><br>Name / date / decision</div><div>Application owner<br><br>Name / date / decision</div></div></article>`;
}

route();
})();

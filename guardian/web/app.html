<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Chain Guardian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/static/d3.min.js"></script>
<script src="/static/vis-network.min.js"></script>
<style>
:root{
  --bg:#f6f7fb; --surface:#fff; --surface-2:#fafbfd; --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e6e9f0; --line-2:#eef1f6;
  --brand:#4338ca; --brand-2:#6366f1; --brand-soft:#eef0ff; --teal:#0d9488; --teal-soft:#e6f6f4;
  --crit:#dc2626; --crit-soft:#fdecec; --high:#ea580c; --high-soft:#fff1e7; --med:#ca8a04; --med-soft:#fdf6e3;
  --low:#2563eb; --low-soft:#e9f0ff; --info:#64748b; --info-soft:#f1f5f9;
  --ev:#15803d; --ev-soft:#effaf3; --ev-line:#bfe6cd; --ai:#7c3aed; --ai-soft:#f6f1ff; --ai-line:#dccbfb;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05); --shadow-lg:0 20px 50px rgba(15,23,42,.12);
  --r:14px; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none;cursor:pointer} a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;letter-spacing:-.018em}
code,.mono{font-family:var(--mono);font-size:12.5px}
code{background:var(--line-2);padding:1px 6px;border-radius:5px;color:var(--ink-2);word-break:break-all}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .xs{font-size:11.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hidden{display:none!important}

/* top bar */
.topbar{background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tb{max-width:1360px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--teal));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(67,56,202,.25)}
.brand b{display:block;font-size:15px;font-weight:700} .brand span{font-size:11.5px;color:var(--muted)}
.tb .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.mchip i{width:7px;height:7px;border-radius:50%;background:var(--teal)} .mchip.ai i{background:var(--ai)}
.tabs{max-width:1360px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);padding:9px 12px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)} .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tab .n{font-size:10.5px;background:var(--line-2);color:var(--muted);border-radius:999px;padding:0 7px;font-weight:700}
.tab.active .n{background:var(--brand-soft);color:var(--brand)}

main{max-width:1360px;margin:0 auto;padding:26px 24px 90px}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.vhead h2{font-size:23px;font-weight:800} .vhead p{margin:5px 0 0;color:var(--muted);max-width:780px}
.plain{display:block;background:none;border:0;border-left:3px solid var(--line);border-radius:0;padding:2px 0 2px 12px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.plain b{color:var(--ink-2);font-weight:600} .plain .ic{display:none} .plain>div{display:inline}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-Critical{background:var(--crit-soft);color:var(--crit)} .b-High{background:var(--high-soft);color:var(--high)} .b-Medium{background:var(--med-soft);color:#a16207} .b-Low{background:var(--low-soft);color:var(--low)} .b-Info{background:var(--info-soft);color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.new{background:var(--crit);color:#fff;font-weight:700} .chip.aich{background:var(--ai-soft);color:var(--ai);font-weight:600}
.chip.scope-runtime{background:#fef3c7;color:#92400e} .chip.scope-dev{color:var(--muted)} .chip.scope-build{background:#e0f2fe;color:#075985} .chip.scope-ci{background:#ede9fe;color:#5b21b6}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--brand-2);color:var(--brand);text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand-2);color:#fff}
.btn.ghost{background:transparent} .btn:disabled{opacity:.5;cursor:not-allowed}
input.in,select.in{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink);outline:none}
input.in:focus,select.in:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{appearance:none;font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- LANDING ---------- */
.landing{max-width:1160px;margin:0 auto}
.lhero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:34px 0 26px}
.lhero .kicker{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px;letter-spacing:.03em}
.lhero h1{font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-.035em;margin:16px 0 14px}
.lhero h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.lhero p{font-size:16px;color:var(--ink-2);margin:0 0 22px;max-width:560px}
.scanbox{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px;box-shadow:var(--shadow-lg);max-width:600px}
.scanbox input{flex:1;border:0;outline:none;font:inherit;font-size:14.5px;padding:8px 10px;min-width:0;background:transparent}
.scanbox .gh{display:grid;place-items:center;padding-left:8px;color:var(--muted)}
.err{color:var(--crit);font-size:13px;margin-top:8px;min-height:18px}
/* conveyor illustration */
.belt{position:relative;height:250px;border-radius:20px;background:linear-gradient(160deg,#ffffff,#f1f0ff 60%,#e8f8f5);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.belt .track{position:absolute;left:0;right:0;top:150px;height:14px;background:repeating-linear-gradient(90deg,#cbd5e1 0 18px,#e2e8f0 18px 36px);animation:roll 1.2s linear infinite;opacity:.8}
@keyframes roll{to{background-position:36px 0}}
.pkg{position:absolute;top:112px;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;animation:move 7s linear infinite;box-shadow:0 6px 14px rgba(15,23,42,.15)}
.pkg.ok{background:linear-gradient(135deg,#14b8a6,#0d9488)} .pkg.bad{background:linear-gradient(135deg,#f87171,#dc2626);animation:moveBad 7s linear infinite}
@keyframes move{0%{left:-50px}100%{left:110%}}
@keyframes moveBad{0%{left:-50px;transform:none}48%{left:46%;transform:none}55%{left:48%;transform:translateY(-70px) rotate(-12deg);opacity:1}70%{left:48%;transform:translateY(-70px) rotate(-12deg);opacity:0}100%{left:48%;opacity:0}}
.shield{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:120px;height:140px;display:grid;place-items:center}
.shield svg{filter:drop-shadow(0 10px 24px rgba(67,56,202,.35))}
.belt .cap{position:absolute;bottom:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.belt .cap b{color:var(--ink)}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:12px}
.preset{padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.preset:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.preset .pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.preset h3{font-size:18px;font-weight:700}
.preset p{margin:0;color:var(--ink-2);font-size:13.5px}
.preset .tags{display:flex;gap:6px;flex-wrap:wrap}
.preset .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;align-items:center}
.steps-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:34px 0 10px}
.ss{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.ss .i{font-size:22px} .ss b{display:block;font-size:12.5px;margin-top:6px} .ss span{font-size:11.5px;color:var(--muted)}

/* ---------- SCANNING ---------- */
.scanwrap{max-width:860px;margin:0 auto}
.pbar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;margin:14px 0 26px}
.pbar div{height:100%;background:linear-gradient(90deg,var(--brand),var(--teal));transition:width .5s}
.tl{position:relative;padding-left:4px}
.tstep{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:0 0 22px;position:relative}
.tstep:before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.tstep:last-child:before{display:none}
.tstep .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--surface);border:1px solid var(--line);z-index:1;transition:.3s}
.tstep.running .ico{border-color:var(--brand-2);box-shadow:0 0 0 5px var(--brand-soft);animation:pulse 1.4s infinite}
.tstep.done .ico{background:var(--ev-soft);border-color:var(--ev-line)}
.tstep.done:before{background:var(--ev-line)}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(99,102,241,.08)}}
.tstep h4{font-size:15px;font-weight:700;margin-top:3px;display:flex;gap:8px;align-items:center}
.tstep .lay{font-size:13px;color:var(--muted);margin:2px 0 6px}
.tstep .msg{font-size:13px;color:var(--ink-2)}
.tstep.pending{opacity:.55}
.tstep .met{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.spin{width:13px;height:13px;border:2px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- JOURNEY ---------- */
.journey{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.jnav{position:sticky;top:130px;padding:10px}
.jnav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;appearance:none;border:0;background:none;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink-2)}
.jnav button:hover{background:var(--surface-2)}
.jnav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.jnav .k{width:24px;height:24px;border-radius:7px;background:var(--line-2);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.jnav button.on .k{background:var(--brand);color:#fff}
.chapter{padding:32px 36px;min-height:520px}
.chapter .num{font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.08em}
.chapter h2{font-size:28px;font-weight:800;margin:6px 0 10px;letter-spacing:-.025em}
.chapter .lead{font-size:16px;color:var(--ink-2);max-width:720px;margin:0 0 22px}
.analogy{display:flex;gap:14px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:16px 18px;margin:18px 0;font-size:14px;color:var(--ink-2)}
.analogy .e{font-size:26px;line-height:1}
.bignums{display:flex;gap:34px;flex-wrap:wrap;margin:16px 0}
.bignums div b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.bignums div span{font-size:12.5px;color:var(--muted)}
.chnav{display:flex;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--line-2)}
.funnel{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0}
.fbox{padding:16px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:150px}
.fbox b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.farrow{font-size:22px;color:var(--faint)}

/* ---------- FILES ---------- */
.filesflow{display:grid;grid-template-columns:1fr 160px 1fr;gap:18px;align-items:center}
.fcol{display:flex;flex-direction:column;gap:10px}
.fcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:.15s}
.fcard:hover,.fcard.on{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.fcard .fi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;font-family:var(--mono)}
.fi.json{background:#fff7ed;color:#c2410c} .fi.yml{background:#ede9fe;color:#6d28d9} .fi.docker{background:#e0f2fe;color:#0369a1}
.fcard b{display:block;font-size:13px;font-family:var(--mono);word-break:break-all} .fcard span{font-size:11.5px;color:var(--muted)}
.core{display:grid;place-items:center;text-align:center;gap:8px}
.core .logo{width:64px;height:64px;border-radius:18px}
.viewer{margin-top:18px}
.jt{font-family:var(--mono);font-size:12.5px;line-height:1.7;max-height:560px;overflow:auto;padding:14px 18px}
.jt details{margin-left:16px} .jt>details{margin-left:0}
.jt summary{cursor:pointer;list-style:none;white-space:nowrap}
.jt summary::-webkit-details-marker{display:none}
.jt summary:before{content:"▸";display:inline-block;width:14px;color:var(--faint);transition:transform .15s}
.jt details[open]>summary:before{transform:rotate(90deg)}
.jt .row{margin-left:30px;white-space:nowrap}
.jt .k{color:#7c3aed} .jt .s{color:#047857} .jt .n{color:#c2410c} .jt .b{color:#2563eb} .jt .z{color:var(--faint)}
.jt .meta{color:var(--faint);font-size:11.5px;margin-left:6px}
.jt .hl{background:#fff3c4;border-radius:4px;padding:0 3px}
.jt .more{margin-left:30px;color:var(--brand);cursor:pointer;font-size:12px}
.code{font-family:var(--mono);font-size:12.5px;line-height:1.65;overflow:auto;max-height:560px}
.code .ln{display:grid;grid-template-columns:46px 1fr;white-space:pre}
.code .ln .no{color:var(--faint);text-align:right;padding-right:12px;user-select:none}
.code .ln.hit{background:var(--crit-soft)} .code .ln.hit .no{color:var(--crit);font-weight:700}
.code .tag{display:inline-block;margin-left:10px;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--crit)}

/* ---------- DISCOVERY ---------- */
.dstep{display:grid;grid-template-columns:52px 1fr;gap:16px;margin-bottom:18px}
.dstep .k{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:18px}
.mini-code{white-space:pre;font-family:var(--mono);font-size:12px;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:14px 16px;overflow:auto;max-height:300px;line-height:1.65}
.mini-code .mk{color:#c4b5fd} .mini-code .ms{color:#86efac} .mini-code .mh{background:rgba(250,204,21,.18);border-radius:3px;display:inline-block;width:100%}
.mini-code .mc{color:#64748b}
.bars .r{display:grid;grid-template-columns:170px 1fr 54px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.bars .t{height:10px;background:var(--line-2);border-radius:6px;overflow:hidden} .bars .t div{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand-2),var(--teal))}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--muted);height:100%}
.cols .c{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--brand-2),var(--brand));min-height:2px}

/* ---------- SUPPLY CHAIN ---------- */
.suppliers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:6px}
.sup{padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2);font-size:12.5px}
.sup b{display:block;font-size:13px} .sup.warn{border-color:#fca5a5;background:#fff5f5}
.sup .hosts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.downs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;text-align:center;color:var(--faint);font-size:12px;margin:2px 0 8px}
.chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;align-items:stretch}
.stage{padding:18px 16px;cursor:pointer;position:relative;border-radius:16px;border:1px solid var(--line);background:var(--surface);margin:0 10px;transition:.15s;box-shadow:var(--shadow)}
.stage:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stage:not(:last-child):after{content:"";position:absolute;right:-17px;top:50%;width:14px;height:14px;border-top:2px solid var(--faint);border-right:2px solid var(--faint);transform:translateY(-50%) rotate(45deg)}
.stage .si{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;margin-bottom:10px}
.stage h4{font-size:14px;font-weight:700} .stage .sub{font-size:12px;color:var(--muted);margin:2px 0 12px;min-height:34px}
.stage .cnt{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stage .cl{font-size:11.5px;color:var(--muted)}
.stage .sev{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line-2);margin:10px 0}
.stage ul{list-style:none;margin:0;padding:0;font-size:12px;color:var(--ink-2)} .stage li{padding:3px 0;border-top:1px solid var(--line-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage.hot{border-color:#fca5a5}
.stage .ring{position:absolute;top:14px;right:14px}

/* ---------- GRAPH ---------- */
.gcard{position:relative;overflow:hidden}
#net{height:calc(100vh - 230px);min-height:600px;background:radial-gradient(circle at 1px 1px,#e5e8f0 1px,transparent 0) 0 0/22px 22px}
.gpanel{position:absolute;top:66px;right:14px;width:330px;max-height:calc(100% - 80px);overflow:auto;padding:16px;z-index:2}
.glegend{position:absolute;left:14px;bottom:14px;z-index:2;padding:10px 12px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.sw.dia{border-radius:1px;transform:rotate(45deg);width:9px;height:9px}
.sw.box{border-radius:2px;width:14px}
.why{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:12.5px}
.why.direct{background:#f1f5f9;border:1px solid #cbd5e1} .why.trans{background:var(--brand-soft);border:1px solid #c7d2fe}
.why h5{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.why .src{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin:6px 0;font-size:12px}
.why .fname{font-family:var(--mono);font-weight:600;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.why .rule{font-size:11px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.why ul{margin:4px 0 0;padding-left:16px}

/* ---------- VULN MAP ---------- */
#swarm svg{display:block;width:100%}
.tip{position:fixed;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;z-index:60;max-width:300px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .1s}
.malcard{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(90deg,#fff1f1,#fff);border:1px solid #fecaca;cursor:pointer}
.malcard .sk{font-size:26px}
.sevcards .card{padding:16px 18px}
.sevcards b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}

/* ---------- CASE FILES ---------- */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.case{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:.15s}
.case:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.case .ch{padding:14px 16px 10px;display:flex;gap:10px;align-items:flex-start}
.case .ct{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.case h4{font-size:14px;font-weight:700;line-height:1.35}
.case .cb{padding:0 16px 14px;display:grid;gap:10px}
.case .pw{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:9px 12px;border-left:3px solid var(--brand-2)}
.case .cf{padding:10px 16px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:auto}
.namecmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namecmp div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.namecmp b{font-family:var(--mono);font-size:16px;letter-spacing:.02em} .namecmp .x{background:var(--crit);color:#fff;border-radius:3px;padding:0 1px}
.namecmp .lbl{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.dlbar{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:11.5px}
.dlbar .t{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden} .dlbar .t div{height:100%;border-radius:5px}
.term{font-family:var(--mono);font-size:11.5px;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.term .p{color:#f87171}
.hashcmp{font-family:var(--mono);font-size:11px;display:grid;gap:6px}
.hashcmp div{padding:7px 9px;border-radius:8px;border:1px solid var(--line);word-break:break-all}
.hashcmp .old{background:var(--ev-soft);border-color:var(--ev-line)} .hashcmp .nw{background:var(--crit-soft);border-color:#fecaca}
.hashcmp span{display:block;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.urlbox{font-family:var(--mono);font-size:11.5px;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);word-break:break-all}
.urlbox .h{background:var(--crit-soft);color:var(--crit);font-weight:700;border-radius:3px;padding:0 2px}
.snip{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.snip div{display:grid;grid-template-columns:34px 1fr;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.snip .no{color:var(--faint);text-align:right;padding-right:8px;background:var(--surface-2)}
.snip .hit{background:var(--crit-soft)} .snip .hit .no{color:var(--crit);font-weight:700;background:var(--crit-soft)}

/* ---------- FINDINGS / DETAIL ---------- */
.md{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;align-items:start}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.filters .in{flex:1 1 30%} .filters input.in{flex:1 1 100%}
.flist{max-height:calc(100vh - 300px);overflow:auto}
.fitem{padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;border-left:3px solid transparent}
.fitem:hover{background:var(--surface-2)} .fitem.sel{background:var(--brand-soft);border-left-color:var(--brand)}
.fitem .t{font-size:13.5px;font-weight:600;line-height:1.35;margin:5px 0 3px}
.fitem .c{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.fitem .top{display:flex;gap:6px;flex-wrap:wrap}
.detail{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto}
.dhead{padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.dhead h3{font-size:19px;font-weight:700;line-height:1.3;margin:8px 0 6px}
.dbody{padding:20px 24px;display:grid;gap:18px}
.dl{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0}
.pathc{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:2px 0 6px}
.pnode{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2)}
.pnode.root{background:var(--brand-soft);color:var(--brand);font-weight:600} .pnode.leaf{background:var(--crit-soft);color:var(--crit);font-weight:600}
.parr{color:var(--faint)}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.evbox{background:var(--ev-soft);border:1px solid var(--ev-line);border-radius:12px;padding:14px 16px} .evbox .sec-t{color:var(--ev)}
.evbox li{font-size:13px;padding:6px 0;border-bottom:1px solid var(--ev-line);color:var(--ink-2);list-style:none} .evbox li:last-child{border-bottom:0}
.evbox ul{margin:0;padding:0} .evbox .src{font-weight:700;color:var(--ev);margin-right:5px}
.aiblk{background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:12px;padding:14px 16px} .aiblk .sec-t{color:var(--ai)}
.aiq{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px} .aiq dt{font-weight:600;color:var(--ai)} .aiq dd{margin:0;color:var(--ink-2)}
.guard{margin-top:12px;padding-top:10px;border-top:1px dashed var(--ai-line);font-size:12px;display:flex;gap:14px;flex-wrap:wrap} .guard b{color:var(--ev)}
.score{display:flex;gap:16px;align-items:center}
.gauge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none} .gauge span{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.rat{display:grid;gap:4px;font-size:12.5px;flex:1} .rat div{display:flex;gap:8px} .rat .d{font-family:var(--mono);font-weight:600;min-width:42px;text-align:right}
.rat .plus{color:var(--crit)} .rat .minus{color:var(--ev)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,96vw);background:var(--surface);z-index:51;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s ease;overflow:auto}
.drawer.on{transform:none}
.drawer .x{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);z-index:2}

/* report doc */
.doc{max-width:920px;margin:0 auto;padding:48px 56px}
.doc h1{font-size:28px;font-weight:800}
.doc h2{font-size:17px;font-weight:700;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc p,.doc li{color:var(--ink-2)}
.dmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.dmeta b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:18px} .sign div{border:1px dashed var(--line);border-radius:10px;padding:16px;min-height:80px;font-size:12.5px;color:var(--muted)}

@media (max-width:1100px){.lhero,.g2,.g3,.g4,.md,.journey,.filesflow,.chain,.suppliers,.downs,.presets{grid-template-columns:1fr}.steps-strip{grid-template-columns:repeat(2,1fr)}.stage{margin:8px 0}.stage:after{display:none}.jnav,.detail{position:static}.gpanel{position:static;width:auto}.downs{display:none}}
@media (max-width:640px){main{padding:18px 16px 70px}.tb{padding:10px 16px}.lhero h1{font-size:34px}.chapter{padding:22px 18px}.doc{padding:24px 18px}.dl,.aiq{grid-template-columns:1fr}.dmeta{grid-template-columns:1fr}}
@media print{.topbar,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;border:0}.doc{padding:0}}
/* ---------- calmer theme: flat colours, no gradients or glow ---------- */
:root{--brand:#1e3a8a;--brand-2:#1d4ed8;--brand-soft:#eef2ff;--shadow:0 1px 2px rgba(15,23,42,.05);--shadow-lg:0 4px 14px rgba(15,23,42,.07);--r:10px}
.logo{background:var(--ink);box-shadow:none}
.lhero h1 em{background:none;-webkit-text-fill-color:currentColor;color:var(--brand)}
.pbar div{background:var(--brand)}
.belt{background:var(--surface-2)}
.tstep.running .ico{box-shadow:0 0 0 3px var(--brand-soft);animation:none}
.preset:hover{transform:none}
.topbar{backdrop-filter:none;background:var(--surface)}
/* ---------- tabs: "More" menu ---------- */
.tabmore{position:relative}
.tabmenu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);padding:4px;min-width:220px}
.tabmenu button{display:block;width:100%;text-align:left;appearance:none;border:0;background:none;font:inherit;font-size:13px;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2)}
.tabmenu button:hover{background:var(--surface-2)} .tabmenu button.on{color:var(--brand);font-weight:600}
.tabmenu.hidden{display:none}
.tstep .ico{font-size:14px;font-weight:700;color:var(--muted)}
/* ---------- FIXES (human approval) ---------- */
.fixblk{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.fixhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px}
.fxst{font-size:11.5px;font-weight:600;border-radius:4px;padding:2px 7px;white-space:nowrap;border:1px solid var(--line)}
.fxst.ok{color:var(--ev);border-color:var(--ev-line);background:var(--ev-soft)} .fxst.no{color:var(--crit);border-color:#fecaca;background:var(--crit-soft)} .fxst.wait{color:var(--muted)}
.chip.bump-patch{background:var(--ev-soft);color:var(--ev)} .chip.bump-minor{background:var(--low-soft);color:var(--low)} .chip.bump-major{background:var(--crit-soft);color:var(--crit);font-weight:700}
.dv{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:340px;font-family:var(--mono);font-size:12px}
.dvh{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dvh span{padding:6px 10px} .dvh span+span{border-left:1px solid var(--line)}
.dv table{border-collapse:collapse;width:100%;table-layout:fixed}
.dv td{padding:1px 8px;white-space:pre;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.dv td.ln{width:36px;color:var(--faint);text-align:right;user-select:none;background:var(--surface-2)}
.dv td.o{border-right:1px solid var(--line)}
.dv tr.del td.o,.dv tr.chg td.o{background:#fdecec} .dv tr.add td.n,.dv tr.chg td.n{background:#e9f8ee}
.dv tr.gap td{text-align:center;color:var(--faint);background:var(--surface-2)}
.fxdec{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fxdec .in{padding:7px 10px;font-size:13px} .fxdec .in.need{border-color:var(--crit)}
.fxsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.fxsteps div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface)}
.fxsteps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;margin-right:8px}
.fxbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fxcounts{display:flex;gap:18px;flex-wrap:wrap;font-size:13px} .fxcounts b{font-size:18px;margin-right:4px}
.fxrow{border-top:1px solid var(--line-2)} .fxrow-head{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;flex-wrap:wrap} .fxrow-head:hover{background:var(--surface-2)}
.fxrow.open .fxrow-head{background:var(--surface-2)} .fxrow-body{padding:14px 16px 18px;border-top:1px solid var(--line-2)}
@media (max-width:900px){.fxsteps{grid-template-columns:1fr 1fr}}
/* ---------- error states ---------- */
.tstep.error .ico{border-color:#fecaca;background:var(--crit-soft)} .tstep.error:before{background:#fecaca}
.tstep.error .msg{color:var(--crit)}
.st-err{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--crit);color:#fff;font-size:11px;font-weight:800}
.scan-result{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.scan-result.warn{border-color:#fde68a;background:#fffbeb} .scan-result.err{border-color:#fecaca;background:#fff7f7}
.degraded-bar{display:flex;gap:10px;align-items:center;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 14px;margin:0 0 16px;font-size:13px;color:#854d0e}
/* ---------- AGENTS tab ---------- */
.ag-flow{display:grid;grid-template-columns:1fr 24px 1.2fr 24px 1fr 24px 1fr;gap:0;align-items:stretch;margin-bottom:18px}
.ag-col{display:flex;flex-direction:column;gap:10px;justify-content:center}
.ag-branch{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px dashed var(--line);border-radius:12px}
.ag-down{text-align:center;color:var(--faint);font-size:14px;line-height:1}
.ag-arrow{display:grid;place-items:center;color:var(--faint);font-size:16px}
.ag-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;cursor:pointer;min-width:0}
.ag-card:hover,.ag-card.on{border-color:var(--ink)}
.ag-card .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ag-card .n{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.ag-card b{display:block;font-size:14px;margin:4px 0 4px}
.ag-card p{margin:0;font-size:12.5px;color:var(--ink-2)}
.ag-st{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.ag-st.done{color:var(--ev);border-color:var(--ev-line)} .ag-st.skipped{color:var(--muted)} .ag-st.error{color:var(--crit);border-color:#fecaca}
.ag-llm{font-size:11px;color:var(--ink-2);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:4px}
.ag-tl{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.ag-tl .row{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;font-size:12.5px;margin:6px 0}
.ag-tl .track{position:relative;height:12px;background:var(--line-2);border-radius:3px}
.ag-tl .bar{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.ag-tl .bar.skipped{background:var(--line)}
.ag-kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px}
.ag-kv dt{color:var(--muted)} .ag-kv dd{margin:0;word-break:break-word}
@media (max-width:900px){.ag-flow{grid-template-columns:1fr}.ag-arrow{transform:rotate(90deg);height:20px}.ag-tl .row{grid-template-columns:110px 1fr 44px}}
/* ---------- FULL GRAPH (deptree) : scoped under .fg ---------- */
.fg{--fg-bg:#f7f7f5;--fg-panel:#fff;--fg-ink:#111827;--fg-muted:#6b7280;--fg-faint:#a1a1aa;--fg-line:#e5e7eb;--fg-hover:#f3f4f6;--fg-sel:#eef2ff;--fg-accent:#1d4ed8;--fg-edge:#c7c9cc;
  --fg-crit:#b42318;--fg-high:#c4320a;--fg-med:#b54708;--fg-low:#175cd3;--fg-prod:#4b5563;--fg-dev:#c4c7cc;--fg-opt:#a3a3a3;--fg-img:#0e7490;--fg-ci:#64748b;--fg-root:#111827;
  border:1px solid var(--fg-line);border-radius:8px;background:var(--fg-panel);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:560px}
.fg-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--fg-line);font-size:12.5px;color:var(--fg-muted)}
.fg-bar select,.fg-bar input[type=search]{font:inherit;font-size:12.5px;color:var(--fg-ink);border:1px solid var(--fg-line);border-radius:6px;padding:6px 8px;background:#fff}
.fg-bar label{display:inline-flex;gap:5px;align-items:center}
.fg-seg{display:inline-flex;border:1px solid var(--fg-line);border-radius:6px;overflow:hidden}
.fg-seg button{appearance:none;border:0;background:#fff;font:inherit;font-size:12.5px;padding:6px 12px;cursor:pointer;color:var(--fg-muted)}
.fg-seg button.on{background:var(--fg-ink);color:#fff}
.fg-body{flex:1;min-height:0;display:flex}
.fg-stage{flex:1;min-width:0;position:relative;background:var(--fg-bg)}
.fg-stage canvas{display:block;width:100%;height:100%;cursor:grab}
.fg-stage canvas.drag{cursor:grabbing}
.fg-tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--fg-line);border-radius:6px;padding:6px 8px;font-size:12px;display:none;max-width:340px;box-shadow:0 2px 6px rgba(0,0,0,.06);color:var(--fg-ink)}
.fg-tip span{color:var(--fg-muted)}
.fg-legend{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid var(--fg-line);border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--fg-muted);line-height:1.7}
.fg-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.fg-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.fg-zoom button{width:30px;height:30px;border:1px solid var(--fg-line);background:#fff;border-radius:6px;cursor:pointer;font-size:15px;color:var(--fg-ink)}
.fg-zoom button:hover{background:var(--fg-hover)}
.fg-find{position:absolute;left:10px;top:10px;width:280px;max-width:calc(100% - 60px)}
.fg-find input{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--fg-line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--fg-ink)}
.fg-res{background:#fff;border:1px solid var(--fg-line);border-top:0;max-height:280px;overflow:auto;display:none;border-radius:0 0 6px 6px}
.fg-res div{padding:5px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.fg-res div:hover{background:var(--fg-hover)}
.fg-hint{position:absolute;right:10px;bottom:10px;color:var(--fg-faint);font-size:11px}
.fg-side{width:360px;flex:none;border-left:1px solid var(--fg-line);overflow:auto;background:#fff;font-size:13px;color:var(--fg-ink)}
.fg-side section{padding:14px 16px;border-bottom:1px solid var(--fg-line)}
.fg-side h3{margin:0;font-size:15px;word-break:break-all;font-weight:650}
.fg-side h4{margin:0 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-muted);font-weight:600}
.fg-side dl{display:grid;grid-template-columns:92px 1fr;gap:3px 10px;margin:0}
.fg-side dt{color:var(--fg-muted)} .fg-side dd{margin:0;word-break:break-all}
.fg-side ul{list-style:none;margin:0;padding:0}
.fg-side li{padding:3px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fg-side li .l{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fg-side .path{display:block;padding:5px 0;border-bottom:1px dashed var(--fg-line);font-size:12px;word-break:break-word}
.fg-side .path:last-child{border-bottom:0}
.fg-link{cursor:pointer;color:var(--fg-ink)} .fg-link:hover{color:var(--fg-accent);text-decoration:underline}
.fg-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.fg-tag{font-size:11px;color:var(--fg-muted);border:1px solid var(--fg-line);border-radius:4px;padding:0 5px;white-space:nowrap}
.fg-muted{color:var(--fg-muted)}
.fg-num{display:flex;gap:18px;flex-wrap:wrap}
.fg-num div b{display:block;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.fg-num div span{font-size:11.5px;color:var(--fg-muted)}
.fg-bars div{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:12px;margin-bottom:4px}
.fg-bars .t{height:6px;background:var(--fg-hover);border-radius:3px;overflow:hidden} .fg-bars .t span{display:block;height:100%}
.fg-table{overflow:auto;flex:1}
.fg-table table{border-collapse:collapse;width:100%;font-size:12.5px}
.fg-table th,.fg-table td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--fg-line);white-space:nowrap}
.fg-table th{position:sticky;top:0;background:#fff;color:var(--fg-muted);font-weight:600;cursor:pointer;user-select:none}
.fg-table td.n,.fg-table th.n{text-align:right;font-variant-numeric:tabular-nums}
.fg-table tbody tr{cursor:pointer} .fg-table tbody tr:hover{background:var(--fg-hover)} .fg-table tbody tr.sel{background:var(--fg-sel)}
.fg-empty{padding:48px 24px;text-align:center;color:var(--fg-muted)}
@media (max-width:900px){.fg{height:auto}.fg-body{flex-direction:column}.fg-stage{height:62vh;flex:none}.fg-side{width:auto;border-left:0;border-top:1px solid var(--fg-line)}.fg-legend,.fg-hint{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb">
    <a class="logo" href="#/" title="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.6-3.4 8.4-8 9-4.6-.6-8-4.4-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></a>
    <div class="brand"><b>Supply Chain Guardian</b><span>Know what you build. Trust what you ship.</span></div>
    <div class="right" id="tbRight"></div>
  </div>
  <nav class="tabs hidden" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><div class="x"><b id="drawerTitle" class="small"></b><button class="btn ghost" id="drawerClose">✕ Close</button></div><div id="drawerBody"></div></aside>
<div class="tip" id="tip"></div>

<script>
(() => {
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString();
const LV = ['Critical','High','Medium','Low','Info'];
const LVC = {Critical:'#dc2626',High:'#ea580c',Medium:'#ca8a04',Low:'#2563eb',Info:'#94a3b8'};
const CAT = {'malicious-package':'Malicious package','vulnerability':'Known vulnerability','suspicious-change':'Suspicious change','container':'Container','ci-cd':'CI/CD','manifest-hygiene':'Manifest hygiene'};
const badge = f => `<span class="badge b-${f.risk_level}"><i class="dot"></i>${f.risk_level} · ${f.risk_score}</span>`;
const scopeChip = s => `<span class="chip scope-${esc(s)}">${{runtime:'ships to production',dev:'dev / test only',build:'image build',ci:'CI pipeline'}[s]||esc(s)}</span>`;
const pathHTML = p => `<div class="pathc">${p.map((n,i)=>`${i?'<span class="parr">›</span>':''}<span class="pnode ${i===0?'root':i===p.length-1?'leaf':''}">${esc(n)}</span>`).join('')}</div>`;
const api = async (u, o) => { const r = await fetch(u, o); if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.statusText); return r.json(); };
const kb = n => n > 1048576 ? (n/1048576).toFixed(1)+' MB' : n > 1024 ? Math.round(n/1024)+' KB' : n+' B';
const oddHost = h => h !== 'registry.npmjs.org' && !String(h).startsWith('bundled') && h !== 'local';
const plain = html => `<div class="plain"><span class="ic">💡</span><div><b>In plain words:</b> ${html}</div></div>`;
let R = null, F = [], SLUG = null, STEPS = [], PRESETS = [];
const tip = $('#tip');
const showTip = (e, html) => { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };
const hideTip = () => tip.style.opacity = 0;

/* drawer */
function openDrawer(title, html){ $('#drawerTitle').textContent = title; $('#drawerBody').innerHTML = html; $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').scrollTop = 0; bindFindingLinks($('#drawerBody')); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeDrawer; $('#drawerClose').onclick = closeDrawer;
document.addEventListener('keydown', e => e.key === 'Escape' && closeDrawer());
function openFindingDrawer(id){ const f = F.find(x => x.id === id); if (f) openDrawer(CAT[f.category] || f.category, findingDetail(f)); }
function bindFindingLinks(root){ root.querySelectorAll('[data-fid]').forEach(n => n.onclick = e => { e.stopPropagation(); openFindingDrawer(n.dataset.fid); }); }

/* ================= router ================= */
const MORE_TABS = ['files','discovery','chain'];
const TABS = [['journey','The Journey'],['findings','All Findings'],['vulns','Vulnerabilities'],['tamper','Suspicious Changes'],['fullgraph','Full Graph'],['graph','Dependency Graph'],['fixes','Fixes'],['agents','Agents'],['report','Final Report'],['files','Files'],['discovery','How We Discovered'],['chain','Supply Chain']];
async function route(){
  closeDrawer();
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (parts[0] === 'scan' && parts[1]) return scanView(parts[1]);
  if (parts[0] === 'r' && parts[1]) {
    if (SLUG !== parts[1] || !R) { $('#main').innerHTML = '<div class="empty"><span class="spin"></span> Loading report…</div>'; R = await api('/api/report/' + parts[1]); F = R.findings; SLUG = parts[1]; FIX = await api('/api/report/' + SLUG + '/fixes').catch(() => null); }
    return resultView(parts[2] || 'journey');
  }
  landing();
}
window.addEventListener('hashchange', route);

/* ================= LANDING ================= */
async function landing(){
  $('#tabs').classList.add('hidden'); $('#tbRight').innerHTML = '';
  const data = await api('/api/presets'); PRESETS = data.presets; STEPS = data.steps;
  const icon = {nodegoat:['🐐','#ecfdf5'], 'juice-shop':['🧃','#fff7ed']};
  $('#main').innerHTML = `<div class="landing view">
    <div class="lhero">
      <div>
        <span class="kicker">Software supply-chain security</span>
        <h1>See every piece your app is <em>made of</em>, and catch the bad ones.</h1>
        <p>Modern apps are assembled from hundreds of open-source packages written by strangers. The Guardian maps every one, checks it against known-bad lists, looks for signs of tampering, and explains what it found in plain words.</p>
        <form class="scanbox" id="scanForm">
          <span class="gh"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 00-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 016 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0012 .5z"/></svg></span>
          <input id="urlIn" placeholder="https://github.com/owner/repository" autocomplete="off">
          <button class="btn primary" type="submit">Scan repository →</button>
        </form>
        <div class="err" id="err"></div>
      </div>
      <div class="belt">
        <div class="shield"><svg width="96" height="112" viewBox="0 0 24 28"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs><path d="M12 1l10 4v8c0 6.5-4.3 11.7-10 13-5.7-1.3-10-6.5-10-13V5l10-4z" fill="url(#sg)"/><path d="M7.5 13.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="track"></div>
        ${[0,1,2,3,4].map(i=>`<div class="pkg ${i===2?'bad':'ok'}" style="animation-delay:${i*1.4}s">${i===2?'✕':'npm'}</div>`).join('')}
        <div class="cap"><span>📦 open-source packages flow in</span><span><b>Guardian</b> stops the tampered one</span></div>
      </div>
    </div>
    <div class="eyebrow" style="margin:6px 0 10px">Or try one of our prepared targets</div>
    <div class="presets">${PRESETS.map(p => `
      <div class="card preset">
        <div style="display:flex;gap:14px;align-items:center"><div class="pic" style="background:${icon[p.id][1]}">${icon[p.id][0]}</div>
          <div><h3>${esc(p.name)}</h3><a class="small mono" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace('https://',''))}</a></div></div>
        <p>${esc(p.blurb)}</p>
        <div class="tags">${p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
        <div class="acts">
          <button class="btn primary" data-preset="${p.id}">▶ Run live scan</button>
          ${p.last ? `<a class="btn" href="#/r/${esc(p.last.slug)}">Open last result</a><span class="xs muted">${fmt(p.last.components)} components · ${fmt(p.last.findings)} findings · ${new Date(p.last.generated_at).toLocaleString()}</span>` : '<span class="xs muted">Not scanned yet</span>'}
        </div>
      </div>`).join('')}</div>
    <div class="steps-strip">${[['📥','Get the code','clone the repo'],['🧾','Read the list','manifest & lockfile'],['🌳','Family tree','SBOM + graph'],['🚨','Known-bad','CVEs & malware'],['🕵️','Tampering','non-CVE signals'],['🤖','AI explains','grounded in evidence'],['📄','Report','HTML + JSON']]
      .map(s=>`<div class="ss"><div class="i">${s[0]}</div><b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div>
  </div>`;
  const start = async body => {
    $('#err').textContent = '';
    try { const j = await api('/api/scan', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); location.hash = '#/scan/' + j.job; }
    catch (e) { $('#err').textContent = e.message; }
  };
  $('#scanForm').onsubmit = e => { e.preventDefault(); start({url: $('#urlIn').value}); };
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => start({preset: b.dataset.preset}));
}

/* ================= SCANNING ================= */
const STEP_INFO = {
  fetch:['📥','Like collecting the recipe before cooking: we download the project exactly as it is on GitHub.'],
  discover:['🧾','Like reading the ingredients label: which packages did the developers choose, and which came along with them?'],
  sbom:['🌳','We draw the family tree: who depends on whom. This becomes the SBOM, the official parts list.'],
  vulns:['🚨','Every ingredient is checked against three public lists of known security problems and malware (OSV.dev, GitHub Advisory DB, deps.dev).'],
  intel:['🎯','We check whether anyone is actually exploiting these problems (CISA KEV, EPSS), and whether each package is still maintained.'],
  tamper:['🕵️','We look for things no recall list knows yet: look-alike names, secret install programs, odd download sources, risky build steps.'],
  compare:['🔍','We compare with the last known-good version. Anything that changed without explanation is suspicious.'],
  ai:['🤖','An AI writes plain-English explanations, but only from the evidence above. It cannot change the scores.'],
  report:['📄','Everything is written to a report people can read and a JSON file machines can read.'],
};
let poll = null;
async function scanView(jid){
  $('#tabs').classList.add('hidden');
  if (!STEPS.length) STEPS = (await api('/api/presets')).steps;
  $('#tbRight').innerHTML = '<a class="btn ghost" href="#/">← Home</a>';
  $('#main').innerHTML = `<div class="scanwrap view">
    <div class="eyebrow" id="scTarget">Scanning…</div>
    <h2 style="font-size:28px;font-weight:800;margin-top:6px" id="scTitle">The Guardian is at work</h2>
    <div class="muted" id="scSub">Follow each step as it happens. Elapsed <b id="scT">0s</b></div>
    <div class="pbar"><div id="scBar" style="width:2%"></div></div>
    <div class="tl">${STEPS.map(([id,t],i)=>`<div class="tstep pending" id="st-${id}"><div class="ico">${i+1}</div>
      <div><h4>${t} <span class="st"></span></h4><div class="lay">${STEP_INFO[id][1]}</div><div class="msg"></div><div class="met"></div></div></div>`).join('')}</div>
    <div id="scDone"></div></div>`;
  clearInterval(poll);
  const t0 = Date.now();
  const tick = async () => {
    let j; try { j = await api('/api/jobs/' + jid); } catch { clearInterval(poll); $('#scDone').innerHTML = '<div class="err">This scan is no longer available (the server restarted). <a href="#/">Start again</a></div>'; return; }
    $('#scTarget').textContent = 'Scanning · ' + j.target;
    $('#scT').textContent = Math.round((Date.now() - t0) / 1000) + 's';
    const state = {};
    j.events.forEach(ev => { state[ev.step] = state[ev.step] || {}; state[ev.step].status = ev.status; state[ev.step].msg = ev.message; if (Object.keys(ev.metrics).length) state[ev.step].metrics = ev.metrics; });
    let done = 0;
    STEPS.forEach(([id]) => { const el = $('#st-' + id), s = state[id]; if (!s) return;
      el.className = 'tstep ' + s.status; if (s.status === 'done' || s.status === 'error') done++;
      el.querySelector('.st').innerHTML = s.status === 'running' ? '<span class="spin"></span>' : s.status === 'error' ? '<span class="st-err">!</span>' : '<span style="color:var(--ev)">✓</span>';
      el.querySelector('.msg').textContent = s.msg;
      el.querySelector('.met').innerHTML = Object.entries(s.metrics || {}).filter(([k,v]) => v !== null && v !== undefined && v !== '').map(([k,v]) => `<span class="chip">${esc(k)}: <b>${esc(typeof v === 'number' ? fmt(v) : v)}</b></span>`).join('');
    });
    $('#scBar').style.width = Math.max(4, 100 * done / STEPS.length) + '%';
    const degraded = STEPS.filter(([id]) => state[id] && state[id].status === 'error').map(([id, t]) => t);
    if (j.status === 'done') { clearInterval(poll); $('#scTitle').textContent = degraded.length ? 'Scan complete, with warnings' : 'Scan complete'; $('#scBar').style.width = '100%';
      $('#scDone').innerHTML = `<div class="card pad scan-result ${degraded.length ? 'warn' : ''}"><div><b>${degraded.length ? 'Results are ready, but some checks could not run.' : 'Your results are ready.'}</b><div class="small muted">${degraded.length ? 'Not completed: ' + degraded.map(esc).join(', ') + '. Everything else is complete; run the scan again later to fill the gaps.' : 'Start with The Journey for a guided tour.'}</div></div><a class="btn primary" href="#/r/${j.slug}/journey">See the results →</a></div>`;
      R = null; if (!degraded.length) setTimeout(() => { if (location.hash.startsWith('#/scan/' + jid)) location.hash = '#/r/' + j.slug + '/journey'; }, 1800); }
    if (j.status === 'error') { clearInterval(poll); $('#scTitle').textContent = 'Scan stopped';
      const fs = j.failed_step && $('#st-' + j.failed_step);
      if (fs) { fs.className = 'tstep error'; fs.querySelector('.st').innerHTML = '<span class="st-err">!</span>'; fs.querySelector('.msg').textContent = j.error; }
      const stepName = (STEPS.find(([id]) => id === j.failed_step) || [])[1];
      $('#scDone').innerHTML = `<div class="card pad scan-result err"><div><b>${stepName ? 'Stopped at “' + esc(stepName) + '”' : 'The scan could not finish'}</b><div class="small" style="margin-top:4px">${esc(j.error)}</div>${j.detail ? `<details class="xs muted" style="margin-top:8px"><summary>Technical detail</summary><code>${esc(j.detail)}</code></details>` : ''}</div><a class="btn" href="#/">← Try another repository</a></div>`; }
  };
  tick(); poll = setInterval(tick, 700);
}

/* ================= RESULTS SHELL ================= */
const rendered = {};
function resultView(tab){
  const aiOn = R.ai.mode === 'llm';
  $('#tbRight').innerHTML = `<span class="mchip"><i></i>${esc(R.target.name)}@${esc(R.target.version)}${R.target.commit ? ' · ' + esc(R.target.commit) : ''}</span>
    <span class="mchip ai"><i></i>${aiOn ? 'AI · ' + esc(R.ai.model) : 'AI · fallback'}</span><a class="btn" href="#/">+ New scan</a>`;
  const nNew = F.filter(f => f.changed).length;
  const nTamper = F.filter(f => !['vulnerability','malicious-package'].includes(f.category)).length;
  const nV = new Set(F.filter(f => ['vulnerability','malicious-package'].includes(f.category)).map(f => f.component)).size;
  const counts = {vulns: nV, tamper: nTamper, findings: F.length, fixes: (FIX && FIX.plan.fixes.length) || null};
  $('#tabs').classList.remove('hidden');
  const LABEL = {journey:'Overview', fullgraph:'Full graph', graph:'Risk paths'};
  const tabBtn = ([id,t]) => `<button class="tab ${id===tab?'active':''}" data-t="${id}">${LABEL[id]||t}${counts[id]!=null?` <span class="n">${fmt(counts[id])}</span>`:''}</button>`;
  const main = TABS.filter(([id]) => !MORE_TABS.includes(id)), more = TABS.filter(([id]) => MORE_TABS.includes(id));
  const moreActive = more.find(([id]) => id === tab);
  $('#tabs').innerHTML = main.map(tabBtn).join('') + `<div class="tabmore"><button class="tab ${moreActive?'active':''}" id="moreBtn">${moreActive ? esc(LABEL[moreActive[0]]||moreActive[1]) : 'More'} ▾</button><div class="tabmenu hidden" id="moreMenu">${more.map(([id,t]) => `<button data-t="${id}" class="${id===tab?'on':''}">${esc(LABEL[id]||t)}</button>`).join('')}</div></div>`;
  $('#tabs').querySelectorAll('[data-t]').forEach(b => b.onclick = () => location.hash = `#/r/${SLUG}/${b.dataset.t}`);
  $('#moreBtn').onclick = e => { e.stopPropagation(); const m = $('#moreMenu'), r = e.currentTarget.getBoundingClientRect();
    m.style.top = r.bottom + 'px'; m.style.left = Math.min(r.left, innerWidth - 240) + 'px'; m.classList.toggle('hidden'); };
  document.addEventListener('click', () => { const m = $('#moreMenu'); if (m) m.classList.add('hidden'); }, {once: true});
  const fn = {journey, files, discovery, chain, graph, fullgraph: window.fullgraph, agents: agentsView, fixes: fixesView, vulns, tamper, findings, report}[tab] || journey;
  $('#main').innerHTML = '<div class="view" id="v"></div>';
  fn($('#v'));
  const deg = (R.agents && R.agents.degraded) || [];
  if (deg.length) $('#v').insertAdjacentHTML('afterbegin', `<div class="degraded-bar"><b>Partial results.</b> ${deg.map(d => `${esc(d.agent)}: ${esc(d.error)}`).join(' · ')} <a style="margin-left:auto" href="#/r/${SLUG}/agents">Details</a></div>`);
  window.scrollTo({top:0});
}
const goTab = t => location.hash = `#/r/${SLUG}/${t}`;

/* ================= 1. JOURNEY ================= */
let chap = 0;
function journey(el){
  const W = R.checkpoint.what_is_in_the_app, CH = R.checkpoint.what_changed || {}, L = R.checkpoint.what_looks_risky.by_risk_level, D = R.discovery || {};
  const mal = F.filter(f => f.category === 'malicious-package'); const nNew = F.filter(f=>f.changed).length;
  const vulnPk = new Set(F.filter(f=>f.category==='vulnerability').map(f=>f.component)).size;
  const top = D.direct && D.direct[0];
  const typo = F.find(f => f.id.startsWith('TYPO-'));
  const ai = F.filter(f => f.ai);
  const C = [
    {t:'Get the code', e:'📥', lead:`We started from <b>${esc(R.target.upstream || R.target.name)}</b>${R.target.commit?` at commit <code>${esc(R.target.commit)}</code>`:''}. We never run the app or install anything; we only read its files.`,
     an:['📖','Think of it like a food inspector reading the recipe and the supplier invoices, without tasting the dish.'],
     body:`<div class="bignums"><div><b>${(R.files?.inputs||[]).length}</b><span>supply-chain files read</span></div><div><b>0</b><span>lines of app code executed</span></div><div><b>${D.lockfile?.status==='generated'?'computed':'found'}</b><span>exact dependency lockfile</span></div></div>

/* ================= 2. FILES ================= */
function files(el){
  const I = R.files?.inputs || [], O = R.files?.outputs || [];
  const kind = n => n.endsWith('.json') ? ['json','{ }'] : /\.ya?ml$/.test(n) ? ['yml','yml'] : ['docker','🐳'];
  const card = (f, io) => { const [k,ic] = kind(f.name); return `<div class="fcard" data-io="${io}" data-n="${esc(f.name)}"><div class="fi ${k}">${ic}</div><div style="min-width:0"><b>${esc(f.name.split('/').pop())}</b><span>${esc(f.role)} · ${kb(f.size)}</span></div></div>`; };
  el.innerHTML = `<div class="vhead"><div><h2>Files: what goes in, what comes out</h2><p>The Guardian reads only supply-chain files and produces machine-readable evidence. Click any file to look inside.</p></div></div>
    ${plain('The left column is what we <b>read</b> from the project. The right column is what we <b>produce</b>. JSON files open as an interactive tree: click ▸ to unfold a branch.')}
    <div class="card pad"><div class="filesflow">
      <div class="fcol"><div class="eyebrow">Inputs from the repository</div>${I.map(f=>card(f,'in')).join('')}</div>
      <div class="core"><div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.6-3.4 8.4-8 9-4.6-.6-8-4.4-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div><b>Guardian</b><span class="xs muted">parse · resolve · scan · compare · explain</span><span style="font-size:26px;color:var(--faint)">⇢</span></div>
      <div class="fcol"><div class="eyebrow">Evidence produced</div>${O.map(f=>card(f,'out')).join('')}</div>
    </div></div>
    <div class="card viewer"><div class="toolbar"><b id="vName" class="mono small">Select a file</b><span class="muted small" id="vInfo"></span><span style="margin-left:auto"></span><a class="btn hidden" id="vDl" target="_blank">⬇ Download</a></div><div id="vBody"><div class="empty">Pick a file above to see its contents.</div></div></div>`;
  const open = async (io, name) => {
    el.querySelectorAll('.fcard').forEach(c => c.classList.toggle('on', c.dataset.n === name && c.dataset.io === io));
    $('#vName').textContent = name; $('#vBody').innerHTML = '<div class="empty"><span class="spin"></span></div>';
    const url = io === 'in' ? `/api/report/${SLUG}/input?name=${encodeURIComponent(name)}` : `/api/report/${SLUG}/output/${encodeURIComponent(name)}`;
    $('#vDl').classList.toggle('hidden', io !== 'out'); $('#vDl').href = url + '?dl=1';
    const text = await (await fetch(url)).text();
    if (name.endsWith('.json')) {
      let data; try { data = JSON.parse(text); } catch { data = null; }
      $('#vInfo').textContent = data ? describeJSON(name, data) : '';
      $('#vBody').innerHTML = '<div class="jt" id="jt"></div>';
      const expand = name === 'package-lock.json' && R.discovery?.example ? ['packages', R.discovery.example.lock_path] : name === 'guardian_report.json' ? ['checkpoint'] : [];
      jsonTree($('#jt'), data, name, expand);
    } else {
      const hits = {}; F.filter(f => f.location.startsWith(name + ':')).forEach(f => { const ln = +f.location.split(':')[1]; (hits[ln] = hits[ln] || []).push(f); });
      $('#vInfo').textContent = Object.keys(hits).length ? `${Object.keys(hits).length} lines flagged` : '';
      $('#vBody').innerHTML = `<div class="code">${text.split('\n').map((l,i)=>`<div class="ln ${hits[i+1]?'hit':''}"><span class="no">${i+1}</span><span>${esc(l)}${hits[i+1]?hits[i+1].map(f=>`<span class="tag" data-fid="${esc(f.id)}" style="cursor:pointer">⚠ ${esc(f.title)}</span>`).join(''):''}</span></div>`).join('')}</div>`;
      bindFindingLinks($('#vBody'));
    }
  };
  el.querySelectorAll('.fcard').forEach(c => c.onclick = () => open(c.dataset.io, c.dataset.n));
  const first = I.find(f => f.name === 'package.json'); if (first) open('in', first.name);
}
function describeJSON(name, d){
  if (name === 'package-lock.json') return `${fmt(Object.keys(d.packages||{}).length)} entries in "packages" · lockfileVersion ${d.lockfileVersion}`;
  if (name.includes('cdx')) return `${d.bomFormat} ${d.specVersion} · ${fmt((d.components||[]).length)} components · ${fmt((d.dependencies||[]).length)} dependency records`;
  if (name === 'guardian_report.json') return `${fmt((d.findings||[]).length)} findings · schema ${d.schema}`;
  if (name === 'package.json') return `${Object.keys(d.dependencies||{}).length} dependencies · ${Object.keys(d.devDependencies||{}).length} devDependencies`;
  return '';
}
function jsonTree(root, data, label, expandPath){
  const LIMIT = 80;
  const prim = v => v === null ? '<span class="z">null</span>' : typeof v === 'string' ? `<span class="s">"${esc(v.length > 140 ? v.slice(0,140)+'…' : v)}"</span>` : typeof v === 'number' ? `<span class="n">${v}</span>` : `<span class="b">${v}</span>`;
  // idx = position of this key in expandPath; forceOpen for the root only
  const node = (k, v, idx, path, forceOpen) => {
    const isObj = v && typeof v === 'object';
    const onPath = idx >= 0 && String(expandPath[idx]) === String(k);
    const hl = onPath && idx === expandPath.length - 1;
    if (!isObj) return `<div class="row"><span class="k ${hl?'hl':''}">${esc(k)}</span>: ${prim(v)}</div>`;
    const n = Array.isArray(v) ? v.length : Object.keys(v).length;
    return `<details ${(forceOpen || onPath) ? 'open' : ''} data-path="${esc(JSON.stringify(path))}"><summary><span class="k ${hl?'hl':''}">${esc(k)}</span> <span class="meta">${Array.isArray(v)?`[${fmt(n)}]`:`{${fmt(n)}}`}</span></summary><div class="kids"></div></details>`;
  };
  const get = path => path.reduce((o,k) => o[k], data);
  const fill = (det) => {
    const kids = det.querySelector(':scope > .kids'); if (kids.dataset.done) return; kids.dataset.done = 1;
    const path = JSON.parse(det.dataset.path), v = get(path), depth = path.length;
    // only follow expandPath while this branch is on it
    const onPath = path.every((p, i) => String(expandPath[i]) === String(p));
    const idx = onPath ? depth : -1;
    let keys = Array.isArray(v) ? v.map((_,i)=>i) : Object.keys(v);
    const want = onPath ? expandPath[depth] : undefined;
    if (want !== undefined && keys.includes(want)) keys = [want, ...keys.filter(k => k !== want)];
    const render = (from) => keys.slice(from, from + LIMIT).map(k => node(String(k), v[k], idx, [...path, k], false)).join('') + (keys.length > from + LIMIT ? `<div class="more" data-from="${from+LIMIT}">… show ${Math.min(LIMIT, keys.length-from-LIMIT)} more of ${fmt(keys.length - from - LIMIT)}</div>` : '');
    kids.innerHTML = render(0);
    const bind = () => kids.querySelectorAll(':scope > .more').forEach(m => m.onclick = () => { const f = +m.dataset.from; m.outerHTML = render(f); bindAll(kids); bind(); });
    bind(); bindAll(kids);
  };
  const bindAll = scope => scope.querySelectorAll(':scope > details').forEach(d => { d.addEventListener('toggle', () => d.open && fill(d), {once:false}); if (d.open) fill(d); });
  root.innerHTML = data === null ? '<div class="empty">Not valid JSON</div>' : node(label, data, -1, [], true);
  const top = root.querySelector('details'); if (top) { top.dataset.path = '[]'; top.addEventListener('toggle', () => top.open && fill(top)); fill(top); }
  const hl = root.querySelector('.hl'); if (hl) setTimeout(() => hl.scrollIntoView({block:'center'}), 50);
}

/* ================= 3. DISCOVERY ================= */
async function discovery(el){
  const D = R.discovery, W = R.checkpoint.what_is_in_the_app;
  const maxB = Math.max(...D.direct.map(d => d.brings), 1), maxD = Math.max(...D.depth_histogram.map(d => d.count), 1);
  const ex = D.example;
  el.innerHTML = `<div class="vhead"><div><h2>How we discovered the components</h2><p>Three steps, all done by reading files. Nothing is downloaded into node_modules and no package code runs.</p></div></div>
    ${plain(`The developers picked <b>${W.direct}</b> packages. Each of those needs other packages, which need others… We follow every link until nothing is left. Total: <b>${fmt(W.total_components)}</b>.`)}
    <div class="grid g2" style="align-items:start">
      <div class="card pad">
        <div class="dstep"><div class="k">1</div><div><h3 style="font-size:16px">Read what the developers asked for</h3><p class="small muted" style="margin:4px 0 10px"><code>package.json</code>: ${D.manifest.dependencies} runtime + ${D.manifest.devDependencies} development dependencies. These are <i>ranges</i> like <code>^4.13.4</code>, not exact versions.</p><div class="mini-code" id="pjCode">loading…</div></div></div>
        <div class="dstep"><div class="k">2</div><div><h3 style="font-size:16px">Read what was actually delivered</h3><p class="small muted" style="margin:4px 0 10px">${D.lockfile.status === 'generated' ? `The repository has <b>no lockfile</b>, so we computed one with <code>npm install --package-lock-only --ignore-scripts</code>. It resolves versions only and runs no code.` : `<code>package-lock.json</code> (v${D.lockfile.version}) pins the exact version, download URL and content hash of all ${fmt(D.lockfile.entries)} packages.`} Here is the entry for <code>${esc(ex?.name)}</code>:</p><div class="mini-code" id="lkCode">loading…</div></div></div>
        <div class="dstep"><div class="k">3</div><div><h3 style="font-size:16px">Connect the dots like Node.js does</h3><p class="small muted" style="margin:4px 0 10px">For each "needs X", we look in the package's own <code>node_modules</code> first, then walk up the folders, exactly as Node.js does when the app runs. That gives every package's real path back to the app:</p>${ex?pathHTML(ex.path):''}<p class="xs muted">Stored at <code>${esc(ex?.lock_path)}</code>, required by <code>${esc(ex?.required_by)}</code>.</p></div></div>
      </div>
      <div class="grid">
        <div class="card pad"><div class="eyebrow">Who brings the most hidden packages?</div><p class="small muted" style="margin:4px 0 12px">Each bar is a package the developers chose; its length is how many packages it silently pulls in.</p>
          <div class="bars">${D.direct.slice(0,12).map(d=>`<div class="r"><span class="mono" title="${esc(d.name)}@${esc(d.version)}">${esc(d.name)} ${d.scope==='dev'?'<span class="faint">(dev)</span>':''}</span><div class="t"><div style="width:${100*d.brings/maxB}%"></div></div><b>${fmt(d.brings)}</b></div>`).join('')}</div></div>
        <div class="card pad"><div class="eyebrow">How deep does the tree go?</div><p class="small muted" style="margin:4px 0 0">Packages per level. Level 1 = chosen by developers; higher = hidden deeper.</p>
          <div class="cols">${D.depth_histogram.map(d=>`<div title="${d.count} packages at level ${d.depth}"><span>${d.count}</span><div class="c" style="height:${Math.max(2, 130*d.count/maxD)}px"></div><b>${d.depth}</b></div>`).join('')}</div></div>
        <div class="card pad"><div class="eyebrow">Where were they downloaded from?</div>
          <div class="bars" style="margin-top:10px">${D.sources.map(s=>`<div class="r"><span class="mono" style="${oddHost(s.host)?'color:var(--crit);font-weight:600':''}">${esc(s.host)}</span><div class="t"><div style="width:${Math.max(1,100*s.count/D.sources[0].count)}%;${oddHost(s.host)?'background:var(--crit)':''}"></div></div><b>${fmt(s.count)}</b></div>`).join('')}</div>
          <p class="xs muted">Anything not from the official npm registry is highlighted. These packages skip the registry's guarantees.</p></div>
      </div>
    </div>`;
  try {
    const pj = JSON.parse(await (await fetch(`/api/report/${SLUG}/input?name=package.json`)).text());
    const dep = Object.entries(pj.dependencies || {}).slice(0, 14);
    const first = ex?.path?.[1]?.replace(/@[^@]*$/, '');
    $('#pjCode').innerHTML = `<span class="mk">"dependencies"</span>: {\n${dep.map(([k,v])=>`  <span class="${k===first?'mh':''}"><span class="mk">"${esc(k)}"</span>: <span class="ms">"${esc(v)}"</span>,</span>`).join('\n')}${Object.keys(pj.dependencies||{}).length>14?`\n  <span class="mc">… ${Object.keys(pj.dependencies).length-14} more</span>`:''}\n}`;
    const lk = JSON.parse(await (await fetch(`/api/report/${SLUG}/input?name=package-lock.json`)).text());
    const e = lk.packages[ex.lock_path] || {};
    $('#lkCode').innerHTML = `<span class="mk">"${esc(ex.lock_path)}"</span>: {\n${Object.entries(e).map(([k,v])=>`  <span class="${['version','resolved','integrity'].includes(k)?'mh':''}"><span class="mk">"${esc(k)}"</span>: <span class="ms">${esc(JSON.stringify(v).slice(0,110))}</span></span>`).join(',\n')}\n}\n<span class="mc">// version = exact version · resolved = where it came from · integrity = content fingerprint</span>`;

/* ================= 4. SUPPLY CHAIN ================= */
function chain(el){
  const W = R.checkpoint.what_is_in_the_app, D = R.discovery;
  const by = pred => F.filter(pred);
  const stages = [
    {id:'source', i:'📁', c:'#eef0ff', t:'Source repository', s:'package.json, scripts, declared versions', f: by(f => f.location.startsWith('package.json')), items:[R.target.upstream?.replace('https://github.com/','') || R.target.name, `${D.manifest.dependencies} deps · ${D.manifest.devDependencies} dev deps`]},
    {id:'deps', i:'📦', c:'#fff7ed', t:'Dependencies', s:`${fmt(W.total_components)} open-source packages`, f: by(f => f.location.startsWith('package-lock.json') && f.scope !== 'build'), items:[`${W.direct} direct`, `${fmt(W.transitive)} transitive`, `${D.sources.length} download source(s)`]},
    {id:'ci', i:'⚙️', c:'#ede9fe', t:'CI/CD pipeline', s:`${W.ci_workflows.length} GitHub workflows`, f: by(f => f.category === 'ci-cd'), items: W.ci_workflows.map(w => w.split('/').pop())},
    {id:'build', i:'🏗️', c:'#e0f2fe', t:'Image build', s:'Dockerfile instructions', f: by(f => f.id.startsWith('DOCKER-')), items:['Dockerfile']},
    {id:'image', i:'🐳', c:'#e6f6f4', t:'Container image', s:'base OS + runtime', f: by(f => f.id.startsWith('IMAGE-')), items:[...new Set(W.container_images)]},
    {id:'prod', i:'🚀', c:'#fdecec', t:'Production', s:'what actually ships', f: by(f => f.scope === 'runtime'), items:[`${W.runtime} packages ship`, 'dev tools excluded']},
  ];
  const third = [...new Set(F.filter(f=>f.category==='ci-cd' && f.evidence[0]?.data?.third_party).map(f=>f.evidence[0].data.action))];
  const others = D.sources.filter(s => oddHost(s.host));
  const reg = D.sources.find(s => s.host === 'registry.npmjs.org');

      <div class="sup"><b>🐋 Image registries</b><div class="hosts">${[...new Set(W.container_images)].map(i=>`<span class="chip mono">${esc(i)}</span>`).join('')}</div></div>
    </div>
